<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<meta name="mobile-web-app-capable" content="yes">
<!-- Only the services the hub actually uses may be reached; no outside scripts, frames or plugins. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com https://picsum.photos https://fastly.picsum.photos; connect-src https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Family Hub</title>
<link rel="manifest" href="hub-manifest.json">
<link rel="icon" href="hub-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8;
    --card: #fffdfa;
    --ink: #2b2520;
    --muted: #6b6158;
    --line: #ebe3d8;
    --soft: #f3ece2;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 8px 28px rgba(60,40,20,.07);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Nunito, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }

  /* ── Top bar ── */
  .top {
    display: flex; align-items: center; gap: 28px;
    padding: max(16px, env(safe-area-inset-top)) 24px 10px;
  }
  .clock { font-size: 68px; font-weight: 800; letter-spacing: -.03em; line-height: .95; font-variant-numeric: tabular-nums; }
  .date { font-size: 24px; font-weight: 800; }
  .status { font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .status.warn { color: #b4432a; }
  .wx { display: flex; align-items: center; gap: 18px; margin-left: auto; }
  .wx-now { display: flex; align-items: center; gap: 8px; }
  .wx-now .ic { font-size: 40px; }
  .wx-now .tp { font-size: 38px; font-weight: 800; }
  .wx-now .hl { font-size: 16px; color: var(--muted); font-weight: 700; line-height: 1.2; }
  .wx-days { display: flex; gap: 14px; }
  .wx-day { text-align: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .wx-day .ic { font-size: 22px; display: block; }
  .wx-day b { color: var(--ink); }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    border: 0; background: var(--card); box-shadow: var(--shadow);
    width: 52px; height: 52px; border-radius: 16px; font-size: 22px;
    display: grid; place-items: center; text-decoration: none; color: inherit;
  }

  /* ── Main layout ── */
  .main {
    display: grid; grid-template-columns: minmax(0,1fr) 350px; gap: 16px;
    padding: 6px 24px max(20px, env(safe-area-inset-bottom)); min-height: 0;
  }
  .week { display: grid; grid-template-columns: repeat(var(--days, 5), minmax(0,1fr)); gap: 12px; min-height: 0; }
  .day {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .day.today { background: #fff; box-shadow: 0 0 0 3px var(--ink), var(--shadow); }
  .day h3 {
    margin: 0; padding: 14px 14px 10px; font-size: 15px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-weight: 800;
  }
  .day h3 b { display: block; font-size: 32px; color: var(--ink); letter-spacing: -.01em; text-transform: none; line-height: 1.05; }
  .evs { overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .ev {
    --c: #999; display: block; width: 100%; text-align: left; border: 0;
    border-left: 6px solid var(--c); border-radius: 12px; padding: 8px 10px 9px 11px;
    background: color-mix(in srgb, var(--c) 13%, white); font-size: 18px; line-height: 1.25;
  }
  .ev .t { font-weight: 800; font-size: 15px; color: color-mix(in srgb, var(--c) 55%, black); display: flex; gap: 6px; align-items: center; }
  .ev .n { font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
  .ev.allday { background: var(--c); color: var(--on, #fff); border-left-color: rgba(0,0,0,.18); font-weight: 800; }
  .ev.allday .n { font-weight: 800; }
  .ev.past { opacity: .5; }
  /* Three wide columns: large enough to read from across the kitchen. */
  .ev .loc { display: none; }
  .week.d3 .ev .loc { display: block; font-size: 15px; font-weight: 600; color: #5e544c; margin-top: 2px; }
  .day-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 10px; }
  .day-head h3 { padding: 0; flex: 1; min-width: 0; }
  .day-wx { text-align: right; font-weight: 800; font-size: 17px; line-height: 1.15; white-space: nowrap; }
  .day-wx .ic { font-size: 26px; display: block; }
  .day-wx small { font-size: 14px; color: var(--muted); }
  .day-dinner {
    margin: 0 10px 10px; padding: 8px 12px; border-radius: 12px; background: #fdf1e8;
    font-size: 16px; font-weight: 700; line-height: 1.3; color: #5a3a2a;
  }
  .day-dinner b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c0613f; }
  .add-ev {
    display: block; width: 100%; margin-top: 2px; border: 2px dashed var(--line); background: none;
    border-radius: 12px; padding: 9px; font-size: 16px; font-weight: 800; color: var(--muted);
  }
  .week.d7 .day-head { padding: 12px 10px 8px; }
  .week.d7 .day-wx, .week.d7 .day-dinner { display: none; }
  .week.d7 .add-ev { font-size: 14px; padding: 6px; }
  /* Seven columns only fit at the old, smaller size. */
  .week.d7 { gap: 10px; }
  .week.d7 .day h3 { padding: 12px 10px 8px; font-size: 12px; }
  .week.d7 .day h3 b { font-size: 24px; }
  .week.d7 .evs { padding: 0 7px 12px; gap: 6px; }
  .week.d7 .ev { font-size: 15px; padding: 6px 7px 7px 8px; border-left-width: 5px; }
  .week.d7 .ev .t { font-size: 13px; }
  .ev.now { box-shadow: 0 0 0 2px var(--c); background: #fff; }
  .dots { display: inline-flex; gap: 3px; margin-left: auto; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--d); }
  .ev.allday .dots i { box-shadow: 0 0 0 1.5px #fff; }
  .ev.allday .dots { margin-left: 8px; vertical-align: middle; }
  .empty-day { color: var(--muted); font-size: 16px; font-weight: 600; padding: 4px 4px; }

  .welcome {
    grid-column: 1 / -1; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 32px; align-self: start; max-width: 720px;
  }
  .welcome h2 { margin: 0 0 8px; font-size: 30px; }
  .welcome p, .welcome li { font-size: 17px; line-height: 1.5; color: #4d443d; }
  .welcome .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  /* ── Side cards ── */
  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .card h2 {
    margin: 0 0 10px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .aside { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 14px; white-space: nowrap; }

  .meal { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .meal + .meal { border-top: 1px dashed var(--line); }
  .meal .lbl { font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c0613f; min-width: 104px; }
  .meal-tmrw { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); font-weight: 700; }
  .meal-tmrw b { color: var(--ink); }
  .plan-btn { margin-left: auto; border: 0; background: var(--soft); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .sheet.wide { width: min(1000px, 100%); }
  .plan-row { display: grid; grid-template-columns: 110px repeat(3, minmax(0, 1fr)) 48px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plan-row.head { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding-top: 0; }
  .plan-row .dl { font-weight: 800; font-size: 16px; line-height: 1.15; }
  .plan-row .dl small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
  .plan-row input { border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 16px; font-weight: 600; background: #fff; width: 100%; min-width: 0; }
  .plan-row input:focus { border-color: var(--ink); outline: none; }
  .plan-row.today .dl { color: #c0613f; }
  .cart { border: 0; background: var(--soft); border-radius: 10px; height: 42px; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 15px; }
  .chip.new { border-style: dashed; color: var(--muted); }
  .field textarea { border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px; font-weight: 600; background: #fff; color: var(--ink); width: 100%; min-height: 150px; font-family: inherit; }
  @media (max-width: 700px) {
    .plan-row { grid-template-columns: 1fr 48px; }
    .plan-row .dl { grid-column: 1 / -1; }
    .plan-row.head { display: none; }
    .plan-row input { grid-column: 1; }
    .plan-row .cart { grid-column: 2; grid-row: 2 / span 3; height: 100%; }
  }
  .hint { color: var(--muted); font-size: 16px; font-weight: 600; line-height: 1.45; }

  .list-add { display: flex; gap: 8px; margin-bottom: 8px; }
  .list-add input {
    flex: 1; min-width: 0; border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 16px; font-weight: 600; outline: none;
  }
  .list-add input:focus { border-color: var(--ink); }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; font-size: 16px;
    background: var(--ink); color: #fff;
  }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .btn.danger { background: #fbe4dc; color: #a23a20; }
  .li {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 0; background: none; padding: 8px 2px; font-size: 17px; font-weight: 700;
    border-bottom: 1px solid var(--line);
  }
  .li .bx { width: 24px; height: 24px; border-radius: 7px; border: 2.5px solid #cbbfb2; flex: none; display: grid; place-items: center; font-size: 15px; color: #fff; }
  .li.done { color: var(--muted); text-decoration: line-through; }
  .li.done .bx { background: #2a9d8f; border-color: #2a9d8f; }
  .list-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .link-btn { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 16px; padding: 4px; }

  /* ── Overlays ── */
  .overlay { position: fixed; inset: 0; z-index: 50; }
  #saver { background: #000; color: #fff; overflow: hidden; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
  .slide.show { opacity: 1; }
  .slide .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(30px) brightness(.55); }
  .slide .fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.show .fg { animation: drift 30s ease-out both; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
  .saver-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 40px max(32px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.6)); display: flex; align-items: flex-end; gap: 32px;
    text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  .saver-info .clock { font-size: 88px; }
  .saver-info .date { font-size: 26px; }
  .saver-next { margin-left: auto; text-align: right; font-size: 22px; font-weight: 800; max-width: 45%; }
  .saver-next small { display: block; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .saver-empty {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 10%, #3b2d5e, transparent 60%), radial-gradient(ellipse at 90% 90%, #5e2d3a, transparent 60%), #140f1f;
  }

  #night { background: #000; color: #5a5048; display: grid; place-items: center; }
  #night .clock { font-size: 120px; font-weight: 700; }

  #modal { background: rgba(30,22,16,.45); display: grid; place-items: center; padding: 16px; }
  .sheet {
    background: var(--card); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    width: min(720px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 24px;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 26px; }
  .sheet h3 { margin: 22px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .sheet .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .field { display: grid; gap: 4px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .field input, .field select {
    border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px;
    font-weight: 600; background: #fff; color: var(--ink); width: 100%; min-width: 0;
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .member { border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: grid; gap: 10px; }
  .member-head { display: flex; gap: 10px; align-items: end; }
  .member-head .field:first-child { flex: 1; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .member-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .test-out { font-size: 13px; font-weight: 700; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 15px; }
  .check input { width: 22px; height: 22px; }
  .detail-row { font-size: 17px; font-weight: 600; margin: 8px 0; color: #4d443d; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 700;
    box-shadow: var(--shadow);
  }

  /* ── Portrait tablets and phones: stack and scroll ── */
  @media (max-width: 1099px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .main { grid-template-columns: 1fr; align-content: start; }
    .week { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .week.d3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .side { overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
    .wx-days { display: none; }
  }
  @media (max-width: 640px) {
    .top { flex-wrap: wrap; gap: 12px; padding-left: 16px; padding-right: 16px; }
    .clock { font-size: 48px; }
    .date { font-size: 18px; }
    .wx { margin-left: 0; }
    .tools { margin-left: auto; }
    .main { padding-left: 16px; padding-right: 16px; }
    .week { grid-template-columns: 1fr; }
    .saver-info { flex-direction: column; align-items: flex-start; padding-left: 20px; padding-right: 20px; }
    .saver-info .clock { font-size: 64px; }
    .saver-next { margin-left: 0; text-align: left; max-width: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div>
      <div class="date" id="date"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="wx" id="wx"></div>
    <div class="tools">
      <button class="icon-btn" id="btn-snap" title="Add to calendar from a photo" aria-label="Add to calendar from a photo">📷</button>
      <button class="icon-btn" id="btn-photos" title="Photo frame" aria-label="Photo frame">🖼️</button>
      <a class="icon-btn" href="index.html" title="Morning routine" aria-label="Morning routine">☀️</a>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main class="main">
    <section class="week" id="week" aria-label="This week"></section>
    <aside class="side">
      <section class="card" id="meals"></section>
      <section class="card" id="list"></section>
    </aside>
  </main>
</div>

<div class="overlay" id="saver" hidden>
  <div class="saver-empty" id="saver-empty"></div>
  <div class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
  <div class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
  <div class="saver-info">
    <div>
      <div class="clock" data-clock></div>
      <div class="date" data-date></div>
    </div>
    <div class="saver-next" id="saver-next"></div>
  </div>
</div>

<div class="overlay" id="night" hidden><div class="clock" data-clock></div></div>
<div class="overlay" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<input type="file" id="snap-file" accept="image/*" hidden>

<script>
(() => {
  'use strict';

  /* ── Storage ── */
  const K_CFG = 'hub.cfg', K_DATA = 'hub.data', K_LOCAL_LIST = 'hub.list', K_GEO = 'hub.geo', K_WX = 'hub.wx', K_RELOAD = 'hub.reloaded';
  const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const COLORS = ['#e76f51', '#2a9d8f', '#7c5cbf', '#e9a23b', '#3a86ff', '#d6457a'];
  const DEFAULTS = { members: [], zip: '', idleMin: 10, photoSec: 20, days: 3, workFrom: 8, workTo: 17, nightFrom: 22, nightTo: 6, demo: false };
  const REFRESH_MS = 5 * 60 * 1000, PHOTO_REFRESH_MS = 60 * 60 * 1000, NIGHT_IDLE_MS = 2 * 60 * 1000;

  // Settings can arrive in a setup link someone texted, so treat every field as untrusted:
  // colors go into inline styles and URLs get fetched, so only allow the expected shapes.
  function cleanCfg(raw) {
    const c = { ...DEFAULTS, ...(raw && typeof raw === 'object' ? raw : {}) };
    const str = (v, n = 200) => typeof v === 'string' ? v.slice(0, n) : '';
    const num = (v, lo, hi, d) => Number.isFinite(+v) && +v >= lo && +v <= hi ? +v : d;
    c.members = (Array.isArray(c.members) ? c.members : []).slice(0, 8).map(m => ({
      id: str(m?.id, 40).replace(/[^\w-]/g, '') || Math.random().toString(36).slice(2, 10),
      name: str(m?.name, 40),
      color: COLORS.includes(m?.color) ? m.color : COLORS[0],
      url: /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(m?.url || '') ? m.url : '',
      key: str(m?.key, 100),
      email: str(m?.email, 120),
      workEmail: str(m?.workEmail, 120)
    }));
    c.zip = str(c.zip, 10).replace(/[^\w -]/g, '');
    c.idleMin = num(c.idleMin, 0, 240, DEFAULTS.idleMin);
    c.photoSec = num(c.photoSec, 5, 600, DEFAULTS.photoSec);
    c.days = [3, 5, 7].includes(+c.days) ? +c.days : DEFAULTS.days;
    for (const k of ['nightFrom', 'nightTo', 'workFrom', 'workTo']) c[k] = num(c[k], 0, 23, DEFAULTS[k]);
    c.pinSalt = /^[0-9a-f]{32}$/.test(c.pinSalt || '') ? c.pinSalt : '';
    c.pinHash = /^[0-9a-f]{64}$/.test(c.pinHash || '') && c.pinSalt ? c.pinHash : '';
    c.demo = !!c.demo;
    return c;
  }
  let cfg = cleanCfg(load(K_CFG, {}));
  let data = load(K_DATA, {});              // member id → { calendar, meals, list, photos, at, err }
  let events = [];                          // merged events currently on screen, for the detail sheet

  /* ── Helpers ── */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    .replace(':00', '').replace(/\s?([AP])M/i, (_, a) => a.toLowerCase());
  const fmtClock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  const fmtDate = d => d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });

    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;

  /* ── Members & Apps Script calls ── */
  const DEMO_MEMBERS = [{ id: 'demo-a', name: 'Dad', color: COLORS[1], email: 'dad@example.com', workEmail: 'dad@work.example' }, { id: 'demo-b', name: 'Mom', color: COLORS[0], email: 'mom@example.com', workEmail: 'mom@work.example' }];

  async function getScript(m, params) {
    const u = new URL(m.url);
    u.searchParams.set('key', m.key);
    for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
    const r = await fetch(u, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }
  async function postScript(m, body) {
    // text/plain keeps this a "simple" request, which Apps Script can answer without a CORS preflight.
    const r = await fetch(m.url, { method: 'POST', body: JSON.stringify({ key: m.key, ...body }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }

  async function refreshMember(m, parts) {
    const d = data[m.id] || (data[m.id] = {});
    try {
      const j = await getScript(m, { parts: parts.join(',') });
      for (const p of parts) if (p in j) d[p] = j[p];
      const errs = Object.entries(j.errors || {});
      d.err = errs.length ? errs.map(([k, v]) => `${k}: ${v}`).join('; ') : '';
      d.at = Date.now();
    } catch (e) {
      d.err = String(e.message || e);
    }

  const inFlight = new Set();
  async function refreshAll(parts = ['calendar', 'meals', 'list', 'plan']) {
    const tag = parts.join();
    if (inFlight.has(tag)) return;
    inFlight.add(tag);
    try {
      await Promise.all(connected().map(m => refreshMember(m, parts)));
      save(K_DATA, data);
    } finally {
      inFlight.delete(tag);
      render();
    }
  }

  /* ── Calendar ── */
  function mergedEvents() {
    const byKey = new Map();
    for (const m of members()) {
      for (const e of (view()[m.id]?.calendar || [])) {
        // A shared calendar shows up for both people; recurring events share an id, so key on start too.
        const k = `${e.id}|${e.start}`;
        const hit = byKey.get(k);
        if (hit) { if (!hit.owners.includes(m)) hit.owners.push(m); }
        else byKey.set(k, { ...e, owners: [m] });
      }
    }
    return [...byKey.values()];
  }
  function eventsOn(day, all) {
    const s = day.getTime(), e = addDays(day, 1).getTime(), key = dayKey(day);
    const allDay = all.filter(ev => ev.allDay && ev.start <= key && key < ev.end);
    const timed = all.filter(ev => !ev.allDay && new Date(ev.start).getTime() < e && new Date(ev.end).getTime() > s)
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    return { allDay: allDay.sort((a, b) => a.title.localeCompare(b.title)), timed };
  }
  function nextEvent() {
    const now = Date.now();
    return mergedEvents().filter(e => !e.allDay && new Date(e.end).getTime() > now)
      .sort((a, b) => new Date(a.start) - new Date(b.start))[0] || null;
  }

  function renderWeek() {

  // Dark text on light chip colors (the yellow), white on the rest.
  function textOn(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
    return .2126 * r + .7152 * g + .0722 * b > .3 ? '#2b2520' : '#fff';
  }

  function showEvent(ev) {
    const when = ev.allDay
      ? (() => { const s = parseDay(ev.start), e = addDays(parseDay(ev.end), -1); return dayKey(s) === dayKey(e) ? `${fmtDate(s)} · all day` : `${fmtDate(s)} – ${fmtDate(e)}`; })()
      : `${fmtDate(new Date(ev.start))} · ${fmtTime(new Date(ev.start))} – ${fmtTime(new Date(ev.end))}`;
    openSheet(`
      <h2>${esc(ev.title)}</h2>

      ${ev.location ? `<div class="detail-row">📍 ${esc(ev.location)}</div>` : ''}
      <div class="detail-row">🗓️ ${esc(ev.calendar)} — ${ev.owners.map(o => esc(o.name)).join(' & ')}</div>
      <div class="actions"><button class="btn" data-act="close">Done</button></div>`);

  /* ── Meals (Apple Note, sent by an iPhone Shortcut) ── */
  const DAY_RE = /^(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?![a-z])\.?/i;
  const DAY_IDX = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };

  // Reads a weekly plan in whatever shape the note is in: "Monday" on its own line with meals
  // under it, or "Mon – Tacos" on one line. Returns meals per weekday, or null if the note
  // has no day names at all (then the whole note is shown).
  function parseMeals(text) {
    const byDay = {};
    let cur = null, found = false;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.replace(/^[\s\-•*#◦▪︎]+/, '').trim();
      if (!line) continue;
      const m = line.match(DAY_RE);
      if (m) {
        cur = DAY_IDX[m[1].slice(0, 3).toLowerCase()];
        found = true;
        byDay[cur] = byDay[cur] || [];
        const rest = line.slice(m[0].length).replace(/^[\s,]*(\d{1,2}\/\d{1,2}(\/\d{2,4})?)?[\s:–—\-.,)]*/, '').trim();
        if (rest) byDay[cur].push(rest);
      } else if (cur !== null) {
        byDay[cur].push(line);
      }
    }
    return found ? byDay : null;
  }
  function mealRow(item) {
    const m = item.match(/^(breakfast|lunch|dinner|supper|snack|b|l|d)\s*[:\-–—]\s*(.+)$/i);
    if (!m) return `<div class="meal"><span>${esc(item)}</span></div>`;
    const lbl = { b: 'Breakfast', l: 'Lunch', d: 'Dinner' }[m[1].toLowerCase()] || m[1];
    return `<div class="meal"><span class="lbl">${esc(lbl)}</span><span>${esc(m[2])}</span></div>`;
  }
  function latestMealNote() {
    const notes = members().map(m => view()[m.id]?.meals).filter(x => x && x.text);
    notes.sort((a, b) => new Date(b.at) - new Date(a.at));
    return notes[0] || null;
  }
  /* ── Meal plan (stored in the first person's script, like the family list) ── */
  const K_LOCAL_PLAN = 'hub.plan';
  const SLOTS = [['b', 'Breakfast'], ['l', 'Lunch'], ['d', 'Dinner']];
  function currentPlan() {
    if (demoOn()) { view(); return demo.plan || (demo.plan = demoPlan()); }
    const home = listHome();
    const p = home ? data[home.id]?.plan : load(K_LOCAL_PLAN, null);
    return { days: p?.days || {}, favs: p?.favs || [] };
  }
  function applyPlanOp(plan, op) {
    const days = { ...plan.days };
    let favs = plan.favs.slice();
    const clean = (v, n) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, n);
    if (op.action === 'planSet') {
      const day = { b: '', l: '', d: '', ...days[op.date], [op.slot]: clean(op.text, 120) };
      if (day.b || day.l || day.d) days[op.date] = day; else delete days[op.date];
    }
    if (op.action === 'favSave') {
      const name = clean(op.name, 60), gone = (op.oldName || name).toLowerCase();
      favs = favs.filter(f => f.name.toLowerCase() !== gone && f.name.toLowerCase() !== name.toLowerCase());
      favs.push({ name, items: op.items.map(i => clean(i, 80)).filter(Boolean).slice(0, 40) });
      favs.sort((a, b) => a.name.localeCompare(b.name));
    }
    if (op.action === 'favDelete') favs = favs.filter(f => f.name.toLowerCase() !== op.name.toLowerCase());
    return { days, favs };
  }
  async function planOp(op) {
    if (demoOn()) { demo.plan = applyPlanOp(currentPlan(), op); renderMealsEverywhere(); return; }
    const home = listHome();
    if (!home) { save(K_LOCAL_PLAN, applyPlanOp(currentPlan(), op)); renderMealsEverywhere(); return; }
    const d = data[home.id] || (data[home.id] = {});
    d.plan = applyPlanOp(currentPlan(), op);
    renderMealsEverywhere();
    try {
      const j = await postScript(home, op);
      d.plan = j.plan; save(K_DATA, data); renderMealsEverywhere();
    } catch (e) {

    }
  }
  function renderMealsEverywhere() { renderMeals(); renderWeek(); }

  // A day's meals: the planner wins; otherwise fall back to the Apple Note, if there is one.
  function mealsOn(day) {
    const p = currentPlan().days[dayKey(day)];
    if (p) return { b: p.b, l: p.l, d: p.d };
    const note = latestMealNote();
    const items = note && parseMeals(note.text)?.[day.getDay()];
    if (!items?.length) return null;
    const out = { b: '', l: '', d: '', other: [] };
    for (const x of items) {
      const m = x.match(/^(breakfast|lunch|dinner|supper|b|l|d)\s*[:\-–—]\s*(.+)$/i);
      if (m) out[{ breakfast: 'b', lunch: 'l', dinner: 'd', supper: 'd' }[m[1].toLowerCase()] || m[1].toLowerCase()] = m[2];
      else out.other.push(x);
    }
    if (!out.d && out.other.length) out.d = out.other.join(' · ');
    return out;
  }

  // That day's dinner (or the whole day's meals if nothing is labeled dinner).
  function dinnerOn(day) {
    return mealsOn(day)?.d || '';
  }
  function renderMeals() {
    const el = $('#meals');
    const btn = '<button class="plan-btn" data-act="planner">Plan meals</button>';
    const dToday = new Date(), dTomorrow = addDays(dToday, 1);
    if (currentPlan().days[dayKey(dToday)] || currentPlan().days[dayKey(dTomorrow)] || !latestMealNote()) {
      const t = mealsOn(dToday), n = mealsOn(dTomorrow);
      const rows = t ? SLOTS.filter(([k]) => t[k]).map(([k, label]) => `<div class="meal"><span class="lbl">${label}</span><span>${esc(t[k])}</span></div>`).join('') : '';
      const next = n ? SLOTS.filter(([k]) => n[k]).map(([k, label]) => `${label}: ${n[k]}`).join(' · ') : '';
      el.innerHTML = `<h2>🍽️ Today's meals${btn}</h2>
        ${rows || '<div class="hint">Nothing planned for today. Tap <b>Plan meals</b> to fill in the week.</div>'}
        ${next ? `<div class="meal-tmrw">Tomorrow: <b>${esc(next)}</b></div>` : ''}`;
      return;
    }
    const note = latestMealNote();
    const byDay = parseMeals(note.text);
    const stamp = note.at ? `<span class="aside">updated ${ago(new Date(note.at).getTime())}</span>` : '';
    if (!byDay) {
      const lines = note.text.split(/\r?\n/).map(s => s.trim()).filter(Boolean).slice(0, 12);
      el.innerHTML = `<h2>🍽️ Meals${stamp}${btn}</h2>${lines.map(mealRow).join('')}`;
      return;
    }
    const d = new Date().getDay();
    const today = byDay[d] || [], tmrw = byDay[(d + 1) % 7] || [];
    el.innerHTML = `<h2>🍽️ Today's meals${stamp}${btn}</h2>
      ${today.length ? today.map(mealRow).join('') : '<div class="hint">Nothing in the note for today.</div>'}
      ${tmrw.length ? `<div class="meal-tmrw">Tomorrow: <b>${esc(tmrw.join(' · '))}</b></div>` : ''}`;
  }

  /* ── Family list ── */
  function applyListOp(list, op) {
    const now = Date.now();
    list = list.map(i => ({ ...i }));
    if (op.action === 'listAdd' && op.text && !list.some(i => i.id === op.id)) list.push({ id: op.id, text: op.text, done: false, at: now });
    if (op.action === 'listAddMany') for (const it of op.items) if (!list.some(i => i.id === it.id)) list.push({ id: it.id, text: it.text, done: false, at: now });
    if (op.action === 'listToggle') list.forEach(i => { if (i.id === op.id) { i.done = !i.done; i.at = now; } });
    if (op.action === 'listClearDone') list = list.filter(i => !i.done);
    return list;
  }
  function currentList() {
    if (demoOn()) return view()['demo-a'].list;
    const home = listHome();
    return home ? (data[home.id]?.list || []) : load(K_LOCAL_LIST, []);
  }
  async function listOp(op) {

    const home = listHome();
    if (!home) { save(K_LOCAL_LIST, applyListOp(load(K_LOCAL_LIST, []), op)); renderList(); return; }
    const d = data[home.id] || (data[home.id] = {});
    d.list = applyListOp(d.list || [], op);
    renderList();
    try {
      const j = await postScript(home, op);
      d.list = j.list; save(K_DATA, data); renderList();

  function renderList() {
    const el = $('#list');
    const focused = document.activeElement?.id === 'list-input';
    const draft = $('#list-input')?.value || '';
    const items = currentList();
    const open = items.filter(i => !i.done), done = items.filter(i => i.done);
    const li = i => `<button class="li${i.done ? ' done' : ''}" data-li="${esc(i.id)}"><span class="bx">${i.done ? '✓' : ''}</span>${esc(i.text)}</button>`;
    el.innerHTML = `<h2>🛒 Family list<span class="aside">${open.length} to get</span></h2>
      <form class="list-add" id="list-form"><input id="list-input" placeholder="Add an item…" autocomplete="off" enterkeyhint="done"><button class="btn">Add</button></form>

  /* ── Weather (Open-Meteo, no key) ── */
  const WX = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';
  async function getWeather() {
    const zip = String(cfg.zip || '').trim();
    if (!zip) return null;
    const c = load(K_WX, null);
    if (c && c.zip === zip && Date.now() - c.ts < 20 * 60 * 1000) return c;
    let geo = load(K_GEO, null);
    if (!geo || geo.zip !== zip) {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&countryCode=US&language=en`);
      const loc = (await r.json()).results?.[0];
      if (!loc) throw new Error('ZIP not found');
      geo = { zip, lat: loc.latitude, lon: loc.longitude };
      save(K_GEO, geo);
    }
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=5`);
    const j = await r.json();
    const out = { zip, ts: Date.now(), now: { t: Math.round(j.current.temperature_2m), c: j.current.weather_code },
      days: j.daily.time.map((t, i) => ({ t, c: j.daily.weather_code[i], hi: Math.round(j.daily.temperature_2m_max[i]), lo: Math.round(j.daily.temperature_2m_min[i]) })) };
    save(K_WX, out);
    return out;
  }

  async function refreshWeather() {

  function renderWeather() {

  const saver = { on: false, timer: null, order: [], i: 0, layer: 0 };

  function nextPhoto() {
    const urls = photoUrls();
    $('#saver-empty').hidden = urls.length > 0;
    if (!urls.length) return;
    if (saver.i >= saver.order.length) {
      saver.order = urls.slice().sort(() => Math.random() - .5);
      saver.i = 0;
    }
    const url = saver.order[saver.i++];
    const img = new Image();
    img.onload = () => {
      if (!saver.on) return;
      const slides = $$('#saver .slide');
      const next = slides[saver.layer ^ 1];
      next.querySelector('.bg').src = url;
      next.querySelector('.fg').src = url;
      next.classList.add('show');
      slides[saver.layer].classList.remove('show');
      saver.layer ^= 1;
    };
    img.src = url;
  }

  function inNight(d = new Date()) {
    const f = +cfg.nightFrom, t = +cfg.nightTo, h = d.getHours();

  let snap = null;
  // Shrinks the photo to a JPEG around 2000px on the long side, small enough to post to the
  // script and still sharp enough to read a flyer.
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Couldn’t open that picture')); };
      img.src = url;
    });
  }

  // Ingredients for the favorites planned on these days, minus anything already on the list.
  function addGroceries(keys) {
    const { days, favs } = currentPlan();
    const have = new Set(currentList().filter(i => !i.done).map(i => i.text.toLowerCase()));
    const want = [], missing = new Set();
    for (const k of keys) for (const [slot] of SLOTS) {
      const meal = days[k]?.[slot];

  /* ── Sheets: settings, event details ── */
  function openSheet(html, wide = false) { $('#sheet').innerHTML = html; $('#sheet').classList.toggle('wide', wide); $('#modal').hidden = false; }
  function closeSheet() { $('#modal').hidden = true; $('#sheet').innerHTML = ''; }

  let draft = null;
  /* ── Settings PIN: the settings hold the keys to both Google scripts ── */
  let unlockedUntil = 0, pinFails = 0, pinBlockedUntil = 0;
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const randomHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');

  function openSettings() {
    if (cfg.pinHash && Date.now() > unlockedUntil) { askPin(); return; }
    draft = JSON.parse(JSON.stringify(cfg));
    renderSettings();
  }
  function askPin() {
    openSheet(`
      <h2>Enter PIN</h2>
      <div class="hint">Settings are locked because they hold the keys to your Google scripts.</div>
      <form id="pin-form" style="display:grid;gap:14px;margin-top:14px">
        <label class="field">PIN<input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>
        <div class="hint" id="pin-msg"></div>
        <div class="actions" style="margin-top:0">
          <button type="button" class="btn ghost" data-act="close">Cancel</button>
          <button class="btn">Unlock</button>
        </div>
      </form>`);
    setTimeout(() => $('#pin-in')?.focus(), 50);
    $('#pin-form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('#pin-msg');
      if (Date.now() < pinBlockedUntil) { msg.textContent = `Too many tries. Wait ${Math.ceil((pinBlockedUntil - Date.now()) / 1000)} seconds.`; return; }
      if (await sha256(cfg.pinSalt + ':' + $('#pin-in').value) === cfg.pinHash) {
        pinFails = 0;
        unlockedUntil = Date.now() + 5 * 60 * 1000;
        openSettings();
        return;
      }
      pinFails++;
      $('#pin-in').value = '';
      // Each run of five wrong tries locks the pad for longer.
      if (pinFails % 5 === 0) pinBlockedUntil = Date.now() + 60000 * 2 ** (pinFails / 5 - 1);
      msg.textContent = pinFails % 5 === 0 ? 'Too many tries. Locked for a while.' : 'Wrong PIN.';
    });
  }
  function renderSettings() {
    const hours = sel => Array.from({ length: 24 }, (_, h) => `<option value="${h}"${+sel === h ? ' selected' : ''}>${new Date(2000, 0, 1, h).toLocaleTimeString([], { hour: 'numeric' })}</option>`).join('');
    const member = (m, i) => `
      <div class="member" data-i="${i}">
        <div class="member-head">
          <label class="field">Name<input data-f="name" value="${esc(m.name)}" placeholder="e.g. Mom"></label>
          <div class="swatches">${COLORS.map(c => `<button type="button" style="--c:${c}" data-color="${c}" aria-pressed="${m.color === c}" aria-label="Color"></button>`).join('')}</div>
        </div>
        <label class="field">Script URL (ends in /exec)<input data-f="url" value="${esc(m.url)}" placeholder="https://script.google.com/macros/s/…/exec" inputmode="url"></label>
        <label class="field">Key<input data-f="key" type="password" autocomplete="off" value="${esc(m.key)}" placeholder="from the script's setup log"></label>
        <label class="field">Google email (so others can invite them to events)<input data-f="email" value="${esc(m.email || '')}" placeholder="name@gmail.com" inputmode="email"></label>
        <label class="field">Work email (gets a private invite for anything during work hours)<input data-f="workEmail" value="${esc(m.workEmail || '')}" placeholder="name@company.com" inputmode="email"></label>
        <div class="member-foot">
          <button type="button" class="btn ghost" data-act="test">Test connection</button>
          <span class="test-out"></span>
          <button type="button" class="link-btn" data-act="remove" style="margin-left:auto">Remove</button>
        </div>
      </div>`;
    openSheet(`
      <h2>Settings</h2>
      <div class="hint">Each person adds their own Google script so their calendar shows here. The first person's script also holds the family list.</div>
      <h3>People</h3>
      ${draft.members.map(member).join('')}
      <button type="button" class="btn ghost" data-act="add-member">+ Add a person</button>
      <h3>Display</h3>
      <div class="grid2">
        <label class="field">ZIP code (weather)<input id="s-zip" value="${esc(draft.zip)}" inputmode="numeric" maxlength="10"></label>
        <label class="field">Photo frame after (minutes, 0 = never)<input id="s-idle" type="number" min="0" max="240" value="${esc(draft.idleMin)}"></label>
        <label class="field">Days on the calendar<select id="s-days">${[3, 5, 7].map(n => `<option value="${n}"${+draft.days === n ? ' selected' : ''}>${n} days${n === 3 ? ' (biggest text)' : ''}</option>`).join('')}</select></label>
        <label class="field">Seconds per photo<input id="s-psec" type="number" min="5" max="600" value="${esc(draft.photoSec)}"></label>
        <label class="field">Screen goes dark at<select id="s-nf">${hours(draft.nightFrom)}</select></label>
        <label class="field">…and wakes at<select id="s-nt">${hours(draft.nightTo)}</select></label>
        <label class="field">Work day starts<select id="s-wf">${hours(draft.workFrom)}</select></label>
        <label class="field">…and ends<select id="s-wt">${hours(draft.workTo)}</select></label>
      </div>
      <h3>Lock settings</h3>
      <div class="hint">A PIN keeps anyone at the tablet from seeing the keys or changing where the hub sends things. ${cfg.pinHash ? 'A PIN is set.' : 'No PIN yet.'}</div>
      <div class="grid2" style="margin-top:10px">
        <label class="field">${cfg.pinHash ? 'New PIN (blank = keep)' : 'PIN (4–8 digits)'}<input id="s-pin" type="password" inputmode="numeric" autocomplete="new-password" maxlength="8"></label>
      </div>
      ${cfg.pinHash ? '<p><label class="check"><input type="checkbox" id="s-pin-off"> Remove the PIN</label></p>' : ''}
      <h3>Set up another screen</h3>
      <div class="hint">Copies a link with these settings, keys included — open it on the tablet instead of typing everything again. Only send it to each other.</div>
      <div class="actions" style="justify-content:flex-start"><button type="button" class="btn ghost" data-act="copy-setup">Copy setup link</button></div>
      <div class="actions">
        <button type="button" class="btn ghost" data-act="fullscreen">Full screen</button>
        <button type="button" class="btn ghost" data-act="close">Cancel</button>
        <button type="button" class="btn" data-act="save">Save</button>
      </div>`);
  }
  function readSettingsForm() {
    $$('#sheet .member').forEach(el => {
      const m = draft.members[+el.dataset.i];
      $$('[data-f]', el).forEach(inp => { m[inp.dataset.f] = inp.value.trim(); });
    });
    draft.zip = $('#s-zip').value.trim();
    draft.idleMin = Math.max(0, +$('#s-idle').value || 0);
    draft.photoSec = Math.max(5, +$('#s-psec').value || 20);
    draft.days = +$('#s-days').value;
    draft.workFrom = +$('#s-wf').value;
    draft.workTo = +$('#s-wt').value;
    draft.nightFrom = +$('#s-nf').value;
    draft.nightTo = +$('#s-nt').value;
  }
  function applyCfg(next) {
    cfg = cleanCfg(next);
    save(K_CFG, cfg);
    const ids = new Set(cfg.members.map(m => m.id));
    for (const id of Object.keys(data)) if (!ids.has(id)) delete data[id];
    save(K_DATA, data);
    render();
    refreshAll();
    refreshAll(['photos']);
    refreshWeather();
  }
  const b64 = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
  function importFromHash() {
    const m = location.hash.match(/^#setup=([\w-]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    try {
      const next = JSON.parse(unb64(m[1]));
      if (confirm(`Load settings for ${next.members.map(x => x.name).join(' & ') || 'this hub'}? This replaces what's on this screen.`)) applyCfg(next);
    } catch { toast('That setup link is damaged.'); }
  }

  /* ── Events ── */
  document.addEventListener('pointerdown', e => {
    if (wake()) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  document.addEventListener('keydown', () => { lastTouch = Date.now(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); refreshAll(); }
  });

  document.addEventListener('click', async e => {
    const t = e.target;
    if (t.id === 'modal') { closeSheet(); return; }
    const wk = t.closest('[data-week]');
    if (wk) { openPlanner(+wk.dataset.week); return; }
    const cart = t.closest('[data-cart]');
    if (cart) { addGroceries([cart.dataset.cart]); return; }
    const cartWeek = t.closest('[data-cart-week]');
    if (cartWeek) { addGroceries(cartWeek.dataset.cartWeek.split(',')); return; }
    const fav = t.closest('[data-fav]');
    if (fav) { openFavorite(fav.dataset.fav, false); return; }
    const newFav = t.closest('[data-newfav]');
    if (newFav) { openFavorite(newFav.dataset.newfav, true); return; }
    const favDel = t.closest('[data-favdel]');
    if (favDel) { if (confirm(`Delete the favorite "${favDel.dataset.favdel}"?`)) { planOp({ action: 'favDelete', name: favDel.dataset.favdel }); openPlanner(); } return; }
    const add = t.closest('[data-add]');
    if (add) { openAddEvent(add.dataset.add); return; }
    const ev = t.closest('[data-ev]');
    if (ev) { showEvent(events[+ev.dataset.ev]); return; }
    const li = t.closest('[data-li]');
    if (li) { listOp({ action: 'listToggle', id: li.dataset.li }); return; }
    const sw = t.closest('[data-color]');
    if (sw) {
      readSettingsForm();
      draft.members[+sw.closest('.member').dataset.i].color = sw.dataset.color;
      renderSettings();
      return;
    }
    const act = t.closest('[data-act]')?.dataset.act;
    if (!act) return;
    if (act === 'settings') openSettings();
    if (act === 'close') closeSheet();
    if (act === 'planner') openPlanner();
    if (act === 'snap-again') { closeSheet(); openSnap(); }
    if (act === 'snap-send') sendSnap(t.closest('button'));
    if (act === 'demo') { cfg.demo = true; save(K_CFG, cfg); render(); }
    if (act === 'clear-done') listOp({ action: 'listClearDone' });
    if (act === 'fullscreen') { closeSheet(); document.documentElement.requestFullscreen?.().catch(() => {}); }
    if (act === 'add-member') {
      readSettingsForm();
      const used = draft.members.map(m => m.color);
      draft.members.push({ id: uid(), name: '', color: COLORS.find(c => !used.includes(c)) || COLORS[0], url: '', key: '', email: '', workEmail: '' });
      renderSettings();
    }
    if (act === 'remove') {
      readSettingsForm();
      draft.members.splice(+t.closest('.member').dataset.i, 1);
      renderSettings();
    }
    if (act === 'test') {
      readSettingsForm();
      const box = t.closest('.member'), out = $('.test-out', box), m = draft.members[+box.dataset.i];
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(m.url || '')) { out.textContent = 'The URL should start with https://script.google.com and end in /exec'; return; }
      out.textContent = 'Checking…';
      try {
        const j = await getScript(m, { parts: 'calendar,meals,photos' });
        const errs = Object.keys(j.errors || {});
        out.textContent = `✓ ${j.calendar?.length ?? 0} events, ${j.photos?.length ?? 0} photos` +
          (j.meals?.text ? ', meals note' : '') + (errs.length ? ` — problem with ${errs.join(', ')}` : '');
      } catch (err) {
        out.textContent = `✗ ${err.message === 'bad key' ? 'Wrong key' : 'Couldn’t reach it — check the URL and that access is set to "Anyone"'}`;
      }
    }
    if (act === 'save') {
      readSettingsForm();
      const pin = $('#s-pin').value.trim();
      if (pin && !/^\d{4,8}$/.test(pin)) { toast('The PIN must be 4 to 8 digits.'); return; }
      if ($('#s-pin-off')?.checked) { draft.pinHash = ''; draft.pinSalt = ''; }
      else if (pin) { draft.pinSalt = randomHex(16); draft.pinHash = await sha256(draft.pinSalt + ':' + pin); }
      draft.members = draft.members.filter(m => m.name || m.url);
      draft.members.forEach(m => { if (!m.name) m.name = 'Someone'; });
      draft.demo = false;
      closeSheet();
      applyCfg(draft);
    }
    if (act === 'copy-setup') {
      readSettingsForm();
      const link = `${location.origin}${location.pathname}#setup=${b64(JSON.stringify({ ...draft, demo: false }))}`;
      try { await navigator.clipboard.writeText(link); toast('Setup link copied'); }
      catch { prompt('Copy this link:', link); }
    }
  });

  // Planner cells save when you leave them (or pick a favorite from the suggestions).
  document.addEventListener('change', e => {
    const inp = e.target.closest?.('[data-slot]');
    if (!inp) return;
    planOp({ action: 'planSet', date: inp.dataset.date, slot: inp.dataset.slot, text: inp.value });
    // Copying a note-based day into the planner: save its other meals too, so the day moves over whole.
    if (inp.dataset.note) {
      $$(`[data-date="${inp.dataset.date}"]`).forEach(o => {
        delete o.dataset.note;
        if (o !== inp && o.value) planOp({ action: 'planSet', date: o.dataset.date, slot: o.dataset.slot, text: o.value });
      });
    }
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'list-form') return;
    e.preventDefault();
    const input = $('#list-input'), text = input.value.trim();
    if (!text) return;
    input.value = '';
    listOp({ action: 'listAdd', id: uid(), text });
  });

  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-snap').addEventListener('click', openSnap);
  $('#btn-photos').addEventListener('click', () => { lastTouch = Date.now(); startSaver(); });

  /* ── Start ── */
  render();
  tick();
  importFromHash();
  refreshAll();
  refreshAll(['photos']);
  refreshWeather();
  keepAwake();
  setInterval(tick, 5000);
  setInterval(() => refreshAll(), REFRESH_MS);
  setInterval(() => refreshAll(['photos']), PHOTO_REFRESH_MS);
  setInterval(refreshWeather, 20 * 60 * 1000);
  setInterval(renderStatus, 60 * 1000);
})();
</script>
</body>
</html>
