<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4efe8">
<meta name="mobile-web-app-capable" content="yes">
<!-- Only the services the hub actually uses may be reached; no outside scripts, frames or plugins. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://drive.google.com https://*.googleusercontent.com https://*.icloud-content.com https://picsum.photos https://fastly.picsum.photos; connect-src https://script.google.com https://script.googleusercontent.com https://api.open-meteo.com https://geocoding-api.open-meteo.com; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<meta name="referrer" content="no-referrer">
<title>Family Hub</title>
<link rel="manifest" href="hub-manifest.json">
<link rel="icon" href="hub-icon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4efe8;
    --card: #fffdfa;
    --ink: #2b2520;
    --muted: #6b6158;
    --line: #ebe3d8;
    --soft: #f3ece2;
    --shadow: 0 1px 2px rgba(60,40,20,.06), 0 8px 28px rgba(60,40,20,.07);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: Nunito, system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input, select { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app { height: 100dvh; display: grid; grid-template-rows: auto 1fr; }

  /* ── Top bar ── */
  .top {
    display: flex; align-items: center; gap: 28px;
    padding: max(16px, env(safe-area-inset-top)) 24px 10px;
  }
  .clock { font-size: 68px; font-weight: 800; letter-spacing: -.03em; line-height: .95; font-variant-numeric: tabular-nums; }
  .date { font-size: 24px; font-weight: 800; }
  .status { font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .status.warn { color: #b4432a; }
  .wx { display: flex; align-items: center; gap: 18px; margin-left: auto; }
  .wx-now { display: flex; align-items: center; gap: 8px; }
  .wx-now .ic { font-size: 40px; }
  .wx-now .tp { font-size: 38px; font-weight: 800; }
  .wx-now .hl { font-size: 16px; color: var(--muted); font-weight: 700; line-height: 1.2; }
  .wx-days { display: flex; gap: 14px; }
  .wx-day { text-align: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .wx-day .ic { font-size: 22px; display: block; }
  .wx-day b { color: var(--ink); }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    border: 0; background: var(--card); box-shadow: var(--shadow);
    width: 52px; height: 52px; border-radius: 16px; font-size: 22px;
    display: grid; place-items: center; text-decoration: none; color: inherit;
  }

  /* ── Main layout ── */
  .main {
    display: grid; grid-template-columns: minmax(0,1fr) 350px; gap: 16px;
    padding: 6px 24px max(20px, env(safe-area-inset-bottom)); min-height: 0;
  }
  .week { display: grid; grid-template-columns: repeat(var(--days, 5), minmax(0,1fr)); gap: 12px; min-height: 0; }
  .day {
    background: var(--card); border-radius: 18px; box-shadow: var(--shadow);
    display: flex; flex-direction: column; min-height: 0; overflow: hidden;
  }
  .day.today { background: #fff; box-shadow: 0 0 0 3px var(--ink), var(--shadow); }
  .day h3 {
    margin: 0; padding: 14px 14px 10px; font-size: 15px; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); font-weight: 800;
  }
  .day h3 b { display: block; font-size: 32px; color: var(--ink); letter-spacing: -.01em; text-transform: none; line-height: 1.05; }
  .evs { overflow-y: auto; padding: 0 10px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .ev {
    --c: #999; display: block; width: 100%; text-align: left; border: 0;
    border-left: 6px solid var(--c); border-radius: 12px; padding: 8px 10px 9px 11px;
    background: color-mix(in srgb, var(--c) 13%, white); font-size: 18px; line-height: 1.25;
  }
  .ev .t { font-weight: 800; font-size: 15px; color: color-mix(in srgb, var(--c) 55%, black); display: flex; gap: 6px; align-items: center; }
  .ev .n { font-weight: 700; overflow-wrap: break-word; hyphens: auto; }
  .ev.allday { background: var(--c); color: var(--on, #fff); border-left-color: rgba(0,0,0,.18); font-weight: 800; }
  .ev.allday .n { font-weight: 800; }
  .ev.past { opacity: .5; }
  /* Three wide columns: large enough to read from across the kitchen. */
  .ev .loc { display: none; }
  .week.d3 .ev .loc { display: block; font-size: 15px; font-weight: 600; color: #5e544c; margin-top: 2px; }
  .day-head { display: flex; align-items: flex-start; gap: 8px; padding: 14px 14px 10px; }
  .day-head h3 { padding: 0; flex: 1; min-width: 0; }
  .day-wx { text-align: right; font-weight: 800; font-size: 17px; line-height: 1.15; white-space: nowrap; }
  .day-wx .ic { font-size: 26px; display: block; }
  .day-wx small { font-size: 14px; color: var(--muted); }
  .day-dinner {
    margin: 0 10px 10px; padding: 8px 12px; border-radius: 12px; background: #fdf1e8;
    font-size: 16px; font-weight: 700; line-height: 1.3; color: #5a3a2a;
  }
  .day-dinner b { display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #c0613f; }
  .add-ev {
    display: block; width: 100%; margin-top: 2px; border: 2px dashed var(--line); background: none;
    border-radius: 12px; padding: 9px; font-size: 16px; font-weight: 800; color: var(--muted);
  }
  .week.d7 .day-head { padding: 12px 10px 8px; }
  .week.d7 .day-wx, .week.d7 .day-dinner { display: none; }
  .week.d7 .add-ev { font-size: 14px; padding: 6px; }
  /* Seven columns only fit at the old, smaller size. */
  .week.d7 { gap: 10px; }
  .week.d7 .day h3 { padding: 12px 10px 8px; font-size: 12px; }
  .week.d7 .day h3 b { font-size: 24px; }
  .week.d7 .evs { padding: 0 7px 12px; gap: 6px; }
  .week.d7 .ev { font-size: 15px; padding: 6px 7px 7px 8px; border-left-width: 5px; }
  .week.d7 .ev .t { font-size: 13px; }
  .ev.now { box-shadow: 0 0 0 2px var(--c); background: #fff; }
  .dots { display: inline-flex; gap: 3px; margin-left: auto; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--d); }
  .ev.allday .dots i { box-shadow: 0 0 0 1.5px #fff; }
  .ev.allday .dots { margin-left: 8px; vertical-align: middle; }
  .empty-day { color: var(--muted); font-size: 16px; font-weight: 600; padding: 4px 4px; }

  .welcome {
    grid-column: 1 / -1; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 32px; align-self: start; max-width: 720px;
  }
  .welcome h2 { margin: 0 0 8px; font-size: 30px; }
  .welcome p, .welcome li { font-size: 17px; line-height: 1.5; color: #4d443d; }
  .welcome .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }

  /* ── Side cards ── */
  .side { display: flex; flex-direction: column; gap: 14px; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; }
  .card h2 {
    margin: 0 0 10px; font-size: 15px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--muted); font-weight: 800; display: flex; align-items: center; gap: 8px;
  }
  .card h2 .aside { margin-left: auto; letter-spacing: 0; text-transform: none; font-weight: 600; font-size: 14px; white-space: nowrap; }

  .meal { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 21px; font-weight: 700; line-height: 1.3; }
  .meal + .meal { border-top: 1px dashed var(--line); }
  .meal .lbl { font-size: 14px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c0613f; min-width: 104px; }
  .meal-tmrw { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 16px; color: var(--muted); font-weight: 700; }
  .meal-tmrw b { color: var(--ink); }
  .plan-btn { margin-left: auto; border: 0; background: var(--soft); border-radius: 10px; padding: 6px 12px; font-weight: 800; font-size: 14px; letter-spacing: 0; text-transform: none; color: var(--ink); }
  .sheet.wide { width: min(1000px, 100%); }
  .plan-row { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto 48px; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .plan-row.head { font-size: 13px; font-weight: 800; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; padding-top: 0; }
  .plan-row .dl { font-weight: 800; font-size: 16px; line-height: 1.15; }
  .plan-row .dl small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
  .plan-row input { border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 16px; font-weight: 600; background: #fff; width: 100%; min-width: 0; }
  .plan-row input:focus { border-color: var(--ink); outline: none; }
  .plan-row.today .dl { color: #c0613f; }
  .cart { border: 0; background: var(--soft); border-radius: 10px; height: 42px; font-size: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .chip { border: 2px solid var(--line); background: #fff; border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 15px; }
  .chip.new { border-style: dashed; color: var(--muted); }
  .chip.mini { padding: 4px 10px; font-size: 13px; text-decoration: none; color: var(--ink); white-space: nowrap; }
  .plan-info { display: flex; gap: 6px; }
  .tonight { font-size: 24px; font-weight: 800; line-height: 1.25; }
  .tonight small { display: block; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #c0613f; }
  .rl { text-decoration: none; }
  .cook { font-size: 13px; font-weight: 700; color: var(--muted); white-space: nowrap; }
  .week-dinners { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); display: grid; gap: 4px; }
  .week-dinners div { display: flex; gap: 10px; font-size: 16px; font-weight: 700; }
  .week-dinners b { width: 38px; color: var(--muted); flex: none; }
  .field textarea { border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px; font-weight: 600; background: #fff; color: var(--ink); width: 100%; min-height: 150px; font-family: inherit; }
  @media (max-width: 700px) {
    .plan-row { grid-template-columns: 1fr 48px; }
    .plan-row .dl { grid-column: 1 / -1; }
    .plan-row input { grid-column: 1; }
    .plan-row .cart { grid-column: 2; grid-row: 2; }
    .plan-row .plan-info { grid-column: 1 / -1; }
  }
  .hint { color: var(--muted); font-size: 16px; font-weight: 600; line-height: 1.45; }

  .list-add { display: flex; gap: 8px; margin-bottom: 8px; }
  .list-add input {
    flex: 1; min-width: 0; border: 2px solid var(--line); background: #fff; border-radius: 12px;
    padding: 10px 12px; font-size: 16px; font-weight: 600; outline: none;
  }
  .list-add input:focus { border-color: var(--ink); }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 800; font-size: 16px;
    background: var(--ink); color: #fff;
  }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .btn.danger { background: #fbe4dc; color: #a23a20; }
  .li {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    border: 0; background: none; padding: 8px 2px; font-size: 17px; font-weight: 700;
    border-bottom: 1px solid var(--line);
  }
  .li .bx { width: 24px; height: 24px; border-radius: 7px; border: 2.5px solid #cbbfb2; flex: none; display: grid; place-items: center; font-size: 15px; color: #fff; }
  .li.done { color: var(--muted); text-decoration: line-through; }
  .li.done .bx { background: #2a9d8f; border-color: #2a9d8f; }
  .list-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
  .link-btn { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 16px; padding: 4px; }

  /* ── Overlays ── */
  .overlay { position: fixed; inset: 0; z-index: 50; }
  #saver { background: #000; color: #fff; overflow: hidden; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
  .slide.show { opacity: 1; }
  .slide .bg { position: absolute; inset: -40px; width: calc(100% + 80px); height: calc(100% + 80px); object-fit: cover; filter: blur(30px) brightness(.55); }
  .slide .fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .slide.show .fg { animation: drift 30s ease-out both; }
  @keyframes drift { from { transform: scale(1); } to { transform: scale(1.05); } }
  .saver-info {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 80px 40px max(32px, env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(0,0,0,.6)); display: flex; align-items: flex-end; gap: 32px;
    text-shadow: 0 2px 12px rgba(0,0,0,.45);
  }
  .saver-info .clock { font-size: 88px; }
  .saver-info .date { font-size: 26px; }
  .saver-next { margin-left: auto; text-align: right; font-size: 22px; font-weight: 800; max-width: 45%; }
  .saver-next small { display: block; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; opacity: .8; }
  .saver-empty {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 10%, #3b2d5e, transparent 60%), radial-gradient(ellipse at 90% 90%, #5e2d3a, transparent 60%), #140f1f;
  }

  /* Paul's view: the same night-sky look as his morning routine, big pictures, few words. */
  .kid-btn {
    border: 0; border-radius: 16px; height: 52px; padding: 0 18px; font-size: 20px; font-weight: 800;
    background: linear-gradient(135deg, #7c5cbf, #4f3a99); color: #fff; box-shadow: var(--shadow);
  }
  .kid-btn:empty { display: none; }
  #kid {
    color: #fff; overflow-y: auto;
    background: radial-gradient(ellipse 900px 500px at 50% -10%, rgba(255,160,60,.30), transparent),
                radial-gradient(ellipse 700px 600px at 10% 90%, rgba(124,92,191,.40), transparent),
                linear-gradient(180deg, #2d0f5c 0%, #1a0a2e 60%, #0d0820 100%);
  }
  .kid-close {
    position: fixed; top: max(16px, env(safe-area-inset-top)); right: 16px; z-index: 2;
    width: 56px; height: 56px; border-radius: 50%; border: 0; font-size: 24px; font-weight: 800;
    background: rgba(255,255,255,.14); color: #fff;
  }
  .kid-wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 40px 20px; }
  .kid-today {
    border: 0; color: inherit; font: inherit; text-align: center; cursor: pointer;
    width: min(680px, 100%); padding: 28px 24px 30px; border-radius: 36px;
    background: rgba(255,255,255,.10); border: 3px solid rgba(255,255,255,.18);
  }
  .kid-today.school { background: rgba(86,227,159,.16); border-color: rgba(86,227,159,.55); }
  .kid-today.home { background: rgba(255,179,71,.16); border-color: rgba(255,179,71,.55); }
  .kid-today.virtual { background: rgba(79,195,247,.16); border-color: rgba(79,195,247,.55); }
  .kid-day { font-size: 34px; font-weight: 900; letter-spacing: .02em; opacity: .9; }
  .kid-icon { font-size: 190px; line-height: 1.1; margin: 6px 0; }
  .kid-word { font-size: 60px; font-weight: 900; line-height: 1.05; }
  .kid-why { font-size: 30px; font-weight: 800; opacity: .85; margin-top: 8px; }
  .kid-week { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .kid-mini {
    border: 0; color: inherit; font: inherit; cursor: pointer; width: 96px; padding: 12px 6px 14px; border-radius: 22px;
    background: rgba(255,255,255,.08); border: 2px solid transparent; text-align: center;
  }
  .kid-mini.school { border-color: rgba(86,227,159,.45); }
  .kid-mini.home { border-color: rgba(255,179,71,.45); }
  .kid-mini.virtual { border-color: rgba(79,195,247,.45); }
  .kid-mini b { display: block; font-size: 22px; font-weight: 900; }
  .kid-mini span { font-size: 46px; line-height: 1.2; }
  .kid-mini small { display: block; font-size: 15px; font-weight: 800; opacity: .85; }
  .kid-hint { font-size: 18px; font-weight: 700; opacity: .6; }
  @media (max-width: 640px) {
    .kid-icon { font-size: 130px; }
    .kid-word { font-size: 44px; }
    .kid-mini { width: 76px; }
    .kid-mini span { font-size: 36px; }
  }
  #night { background: #000; color: #5a5048; display: grid; place-items: center; }
  #night .clock { font-size: 120px; font-weight: 700; }

  #modal { background: rgba(30,22,16,.45); display: grid; place-items: center; padding: 16px; }
  .sheet {
    background: var(--card); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.25);
    width: min(720px, 100%); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 24px;
  }
  .sheet h2 { margin: 0 0 4px; font-size: 26px; }
  .sheet h3 { margin: 22px 0 8px; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .sheet .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; flex-wrap: wrap; }
  .field { display: grid; gap: 4px; font-size: 13px; font-weight: 800; color: var(--muted); }
  .field input, .field select {
    border: 2px solid var(--line); border-radius: 10px; padding: 9px 10px; font-size: 15px;
    font-weight: 600; background: #fff; color: var(--ink); width: 100%; min-width: 0;
  }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .member { border: 2px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 10px; display: grid; gap: 10px; }
  .member-head { display: flex; gap: 10px; align-items: end; }
  .member-head .field:first-child { flex: 1; }
  .swatches { display: flex; gap: 6px; }
  .swatches button { width: 32px; height: 32px; border-radius: 50%; border: 3px solid transparent; background: var(--c); }
  .swatches button[aria-pressed="true"] { border-color: var(--ink); }
  .member-foot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .test-out { font-size: 13px; font-weight: 700; color: var(--muted); }
  .check { display: flex; gap: 10px; align-items: center; font-weight: 700; font-size: 15px; }
  .check input { width: 22px; height: 22px; }
  .detail-row { font-size: 17px; font-weight: 600; margin: 8px 0; color: #4d443d; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 80;
    background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 14px; font-weight: 700;
    box-shadow: var(--shadow);
  }

  /* ── Portrait tablets and phones: stack and scroll ── */
  @media (max-width: 1099px) {
    body { overflow: auto; }
    .app { height: auto; min-height: 100dvh; }
    .main { grid-template-columns: 1fr; align-content: start; }
    .week { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .week.d3 { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
    .side { overflow: visible; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
    .wx-days { display: none; }
  }
  @media (max-width: 640px) {
    .top { flex-wrap: wrap; gap: 12px; padding-left: 16px; padding-right: 16px; }
    .clock { font-size: 48px; }
    .date { font-size: 18px; }
    .wx { margin-left: 0; }
    .tools { margin-left: auto; }
    .main { padding-left: 16px; padding-right: 16px; }
    .week { grid-template-columns: 1fr; }
    .saver-info { flex-direction: column; align-items: flex-start; padding-left: 20px; padding-right: 20px; }
    .saver-info .clock { font-size: 64px; }
    .saver-next { margin-left: 0; text-align: left; max-width: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <div class="clock" id="clock">--:--</div>
    </div>
    <div>
      <div class="date" id="date"></div>
      <div class="status" id="status"></div>
    </div>
    <div class="wx" id="wx"></div>
    <div class="tools">
      <button class="kid-btn" id="btn-kid" data-act="kid"></button>
      <button class="icon-btn" id="btn-snap" title="Add to calendar from a photo" aria-label="Add to calendar from a photo">📷</button>
      <button class="icon-btn" id="btn-photos" title="Photo frame" aria-label="Photo frame">🖼️</button>
      <a class="icon-btn" href="index.html" title="Morning routine" aria-label="Morning routine">☀️</a>
      <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <main class="main">
    <section class="week" id="week" aria-label="This week"></section>
    <aside class="side">

      <section class="card" id="list"></section>

</div>

<div class="overlay" id="saver" hidden>
  <div class="saver-empty" id="saver-empty"></div>
  <div class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
  <div class="slide"><img class="bg" alt=""><img class="fg" alt=""></div>
  <div class="saver-info">
    <div>
      <div class="clock" data-clock></div>
      <div class="date" data-date></div>
    </div>
    <div class="saver-next" id="saver-next"></div>
  </div>

<div class="overlay" id="kid" hidden>
  <button class="kid-close" data-act="kid-close" aria-label="Back to the family view">✕</button>
  <div class="kid-wrap" id="kid-body"></div>
</div>
<div class="overlay" id="night" hidden><div class="clock" data-clock></div></div>
<div class="overlay" id="modal" hidden><div class="sheet" id="sheet"></div></div>
<div id="toast" hidden></div>
<input type="file" id="snap-file" accept="image/*" hidden>

<script>
(() => {
  'use strict';

  /* ── Storage ── */
  const K_CFG = 'hub.cfg', K_DATA = 'hub.data', K_LOCAL_LIST = 'hub.list', K_GEO = 'hub.geo', K_WX = 'hub.wx', K_RELOAD = 'hub.reloaded';
  const load = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

  const COLORS = ['#e76f51', '#2a9d8f', '#7c5cbf', '#e9a23b', '#3a86ff', '#d6457a'];
  const DEFAULTS = { members: [], zip: '', idleMin: 10, photoSec: 20, days: 3, workFrom: 8, workTo: 17, weekStart: 5, kidName: 'Paul', nightFrom: 22, nightTo: 6, demo: false };
  const REFRESH_MS = 5 * 60 * 1000, PHOTO_REFRESH_MS = 40 * 60 * 1000, NIGHT_IDLE_MS = 2 * 60 * 1000;

  // Settings can arrive in a setup link someone texted, so treat every field as untrusted:
  // colors go into inline styles and URLs get fetched, so only allow the expected shapes.
  function cleanCfg(raw) {
    const c = { ...DEFAULTS, ...(raw && typeof raw === 'object' ? raw : {}) };
    const str = (v, n = 200) => typeof v === 'string' ? v.slice(0, n) : '';
    const num = (v, lo, hi, d) => Number.isFinite(+v) && +v >= lo && +v <= hi ? +v : d;
    c.members = (Array.isArray(c.members) ? c.members : []).slice(0, 8).map(m => ({
      id: str(m?.id, 40).replace(/[^\w-]/g, '') || Math.random().toString(36).slice(2, 10),
      name: str(m?.name, 40),
      color: COLORS.includes(m?.color) ? m.color : COLORS[0],
      url: /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(m?.url || '') ? m.url : '',
      key: str(m?.key, 100),
      email: str(m?.email, 120),
      workEmail: str(m?.workEmail, 120)
    }));
    c.zip = str(c.zip, 10).replace(/[^\w -]/g, '');
    c.idleMin = num(c.idleMin, 0, 240, DEFAULTS.idleMin);
    c.photoSec = num(c.photoSec, 5, 600, DEFAULTS.photoSec);
    c.days = [3, 5, 7].includes(+c.days) ? +c.days : DEFAULTS.days;
    for (const k of ['nightFrom', 'nightTo', 'workFrom', 'workTo']) c[k] = num(c[k], 0, 23, DEFAULTS[k]);
    c.weekStart = num(c.weekStart, 0, 6, DEFAULTS.weekStart);
    c.pinSalt = /^[0-9a-f]{32}$/.test(c.pinSalt || '') ? c.pinSalt : '';
    c.pinHash = /^[0-9a-f]{64}$/.test(c.pinHash || '') && c.pinSalt ? c.pinHash : '';
    c.kidName = str(c.kidName, 20).replace(/[<>&"']/g, '');
    c.demo = !!c.demo;
    return c;
  }
  let cfg = cleanCfg(load(K_CFG, {}));
  let data = load(K_DATA, {});              // member id → { calendar, meals, list, photos, at, err }
  let events = [];                          // merged events currently on screen, for the detail sheet

  /* ── Helpers ── */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const fmtTime = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
    .replace(':00', '').replace(/\s?([AP])M/i, (_, a) => a.toLowerCase());
  const fmtClock = d => d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }).replace(/\s?[AP]M/i, '');
  const fmtDate = d => d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  const ago = t => {
    const m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return 'just now';
    if (m < 60) return `${m} min ago`;
    const h = Math.round(m / 60);
    return h < 24 ? `${h}h ago` : `${Math.round(h / 24)}d ago`;
  };
  function toast(msg) {
    const t = $('#toast'); t.textContent = msg; t.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(() => { t.hidden = true; }, 3500);
  }

  /* ── Members & Apps Script calls ── */
  const DEMO_MEMBERS = [{ id: 'demo-a', name: 'Dad', color: COLORS[1], email: 'dad@example.com', workEmail: 'dad@work.example' }, { id: 'demo-b', name: 'Mom', color: COLORS[0], email: 'mom@example.com', workEmail: 'mom@work.example' }];
  const demoOn = () => cfg.demo && !cfg.members.length;
  const members = () => demoOn() ? DEMO_MEMBERS : cfg.members;
  const connected = () => cfg.members.filter(m => m.url && m.key);
  const listHome = () => connected()[0] || null;

  async function getScript(m, params) {
    const u = new URL(m.url);
    u.searchParams.set('key', m.key);
    for (const [k, v] of Object.entries(params)) u.searchParams.set(k, v);
    const r = await fetch(u, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }
  async function postScript(m, body) {
    // text/plain keeps this a "simple" request, which Apps Script can answer without a CORS preflight.
    const r = await fetch(m.url, { method: 'POST', body: JSON.stringify({ key: m.key, ...body }) });
    const j = await r.json();
    if (j.error) throw new Error(j.error);
    return j;
  }

  async function refreshMember(m, parts) {
    const d = data[m.id] || (data[m.id] = {});
    try {
      const j = await getScript(m, { parts: parts.join(',') });
      for (const p of parts) if (p in j) d[p] = j[p];
      const errs = Object.entries(j.errors || {});
      d.err = errs.length ? errs.map(([k, v]) => `${k}: ${v}`).join('; ') : '';
      d.at = Date.now();
    } catch (e) {
      d.err = String(e.message || e);
    }
  }
  const inFlight = new Set();
  async function refreshAll(parts = ['calendar', 'meals', 'list', 'plan']) {
    const tag = parts.join();
    if (inFlight.has(tag)) return;
    inFlight.add(tag);
    try {
      await Promise.all(connected().map(m => refreshMember(m, parts)));
      save(K_DATA, data);
    } finally {
      inFlight.delete(tag);
      render();
    }
  }

  /* ── Demo data, so the screen can be tried before anything is connected ── */
  function demoData() {
    const t = startOfDay(new Date());
    const at = (day, h, m = 0) => { const d = addDays(t, day); d.setHours(h, m); return d.toISOString(); };
    const ev = (day, h, m, dur, title, location = '') => ({ id: title + day, title, allDay: false, start: at(day, h, m), end: new Date(new Date(at(day, h, m)).getTime() + dur * 60000).toISOString(), location, calendar: 'Family' });
    const all = (day, len, title) => ({ id: title, title, allDay: true, start: dayKey(addDays(t, day)), end: dayKey(addDays(t, day + len)), location: '', calendar: 'Family' });
    const aps = (day, title) => ({ ...all(day, 1, title), calendar: 'APS SY 2026-2027 Calendar' });
    const shared = [ev(0, 17, 30, 60, 'Family dinner at Grandma’s', '12 Oak St'), all(4, 1, 'Paul’s birthday 🎂'),
      aps(3, 'Fall Break - Schools Closed'), aps(5, 'Parent Teacher Conferences - Virtual Learning Days'),
      all(2, 1, '🏫 Picture day'), ev(5, 8, 15, 30, '🏫 Parent–teacher conference', 'Room 12')];
    const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const plan = ['Pancakes & fruit / Pot roast', 'Oatmeal / Tacos', 'Eggs & toast / Spaghetti and meatballs', 'Yogurt parfaits / Chicken stir-fry', 'Waffles / Sheet-pan salmon', 'Smoothies / Homemade pizza night', 'French toast / Burgers on the grill'];
    return {
      'demo-a': {
        calendar: [...shared, ev(0, 7, 45, 15, 'School drop-off'), ev(0, 10, 0, 60, 'Team standup'), ev(1, 18, 0, 90, 'Soccer practice', 'Lincoln Park field 3'), ev(2, 12, 0, 60, 'Lunch with Mike'), ev(3, 16, 30, 60, 'Oil change'), ev(5, 9, 0, 120, 'Soccer game'), ev(6, 10, 0, 90, 'Church')],
        list: [{ id: 'a', text: 'Milk', done: false }, { id: 'b', text: 'Bananas', done: false }, { id: 'c', text: 'Birthday candles', done: false }, { id: 'd', text: 'Coffee filters', done: true }],
        at: Date.now()
      },
      'demo-b': {
        calendar: [...shared, ev(0, 15, 0, 30, 'Paul pickup'), ev(1, 9, 30, 60, 'Dentist — Paul', 'Bright Smiles Dental'), ev(2, 19, 0, 90, 'Book club'), all(3, 1, 'Early release day'), ev(4, 16, 0, 120, 'Birthday party setup'), ev(6, 13, 0, 60, 'Nap time 😴')],
        meals: { text: 'Meals this week\n\n' + plan.map((p, i) => { const [b, dn] = p.split(' / '); return `${DAYS[i]}\nBreakfast: ${b}\nDinner: ${dn}`; }).join('\n\n'), at: new Date(Date.now() - 3 * 3600e3).toISOString() },
        at: Date.now()
      }
    };
  }
  function demoPlan() {
    const t = planWeekStart();
    const menu = ['Chicken pot pie soup', 'Chicken poofies', 'Turkey dinner', 'Pepper steak', 'Slow cooker chicken and dumplings', 'Spaghetti', 'Goulash'];
    const days = {};
    menu.forEach((d, i) => { days[dayKey(addDays(t, i))] = { b: '', l: '', d }; });
    return { days, favs: [
      { name: 'Chicken pot pie soup', link: 'https://example.com/chicken-pot-pie-soup', cooks: [], items: ['Rotisserie chicken', 'Frozen mixed vegetables', 'Cream of chicken soup', 'Biscuits'] },
      { name: 'Spaghetti', link: '', cooks: ['Dad'], items: ['Spaghetti', 'Marinara sauce', 'Ground beef', 'Parmesan'] },
      { name: 'Goulash', link: '', cooks: ['Dad'], items: ['Elbow macaroni', 'Ground beef', 'Diced tomatoes', 'Tomato sauce'] },
      { name: 'Pot roast', link: '', cooks: ['Dad'], items: [] }
    ] };
  }
  const demoPhotos = () => Array.from({ length: 12 }, (_, i) => `https://picsum.photos/seed/familyhub${i}/1600/1000`);
  let demo = null;
  const view = () => demoOn() ? (demo || (demo = demoData())) : data;

  /* ── Calendar ── */
  function mergedEvents() {
    const byKey = new Map();
    for (const m of members()) {
      for (const e of (view()[m.id]?.calendar || [])) {
        // A shared calendar shows up for both people; recurring events share an id, so key on start too.
        const k = `${e.id}|${e.start}`;
        const hit = byKey.get(k);
        if (hit) { if (!hit.owners.includes(m)) hit.owners.push(m); }
        else byKey.set(k, { ...e, owners: [m] });
      }
    }
    return [...byKey.values()];
  }
  function eventsOn(day, all) {
    const s = day.getTime(), e = addDays(day, 1).getTime(), key = dayKey(day);
    const allDay = all.filter(ev => ev.allDay && ev.start <= key && key < ev.end);
    const timed = all.filter(ev => !ev.allDay && new Date(ev.start).getTime() < e && new Date(ev.end).getTime() > s)
      .sort((a, b) => new Date(a.start) - new Date(b.start));
    return { allDay: allDay.sort((a, b) => a.title.localeCompare(b.title)), timed };
  }
  function nextEvent() {
    const now = Date.now();
    return mergedEvents().filter(e => !e.allDay && new Date(e.end).getTime() > now)
      .sort((a, b) => new Date(a.start) - new Date(b.start))[0] || null;
  }

  function renderWeek() {
    const week = $('#week');
    if (!members().length) {
      week.innerHTML = `
        <div class="welcome">
          <h2>Welcome to your Family Hub</h2>
          <p>Both calendars (with school dates pulled from APS email), tonight's dinner, a shared list, and a photo frame when nobody's using it.</p>
          <ol>
            <li>Each of you sets up the small Google script — steps in the README under <b>Family Hub</b>.</li>
            <li>Paste each script's URL and key into Settings here.</li>
            <li>Add the iPhone Shortcut so the meals note shows up.</li>
          </ol>
          <div class="row">
            <button class="btn" data-act="settings">Open Settings</button>
            <button class="btn ghost" data-act="paste-setup">I have a setup link</button>
            <button class="btn ghost" data-act="demo">Try it with sample data</button>
          </div>
        </div>`;
      return;
    }
    events = mergedEvents();
    const today = startOfDay(new Date()), now = Date.now();
    let html = '';
    const days = [3, 5, 7].includes(+cfg.days) ? +cfg.days : 3;
    week.style.setProperty('--days', days);
    week.classList.toggle('d7', days === 7);
    week.classList.toggle('d3', days === 3);
    for (let i = 0; i < days; i++) {
      const day = addDays(today, i);
      const { allDay, timed } = eventsOn(day, events);
      const label = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : day.toLocaleDateString([], { weekday: 'long' });
      const big = i < 2 ? day.toLocaleDateString([], { weekday: 'short', day: 'numeric' }) : day.toLocaleDateString([], { month: 'short', day: 'numeric' });
      const chip = ev => {
        const c = ev.owners[0].color;
        const dots = ev.owners.length > 1 ? `<span class="dots">${ev.owners.map(o => `<i style="--d:${o.color}"></i>`).join('')}</span>` : '';
        const idx = events.indexOf(ev);
        if (ev.allDay) return `<button class="ev allday" style="--c:${c};--on:${textOn(c)}" data-ev="${idx}"><div class="n">${esc(ev.title)}${dots}</div></button>`;
        const s = new Date(ev.start), e = new Date(ev.end);
        const state = e.getTime() <= now ? ' past' : s.getTime() <= now ? ' now' : '';
        const time = (s < day ? 'cont.' : fmtTime(s)) + (days === 3 ? ` – ${fmtTime(e)}` : '');
        const loc = ev.location ? `<span class="loc">📍 ${esc(ev.location)}</span>` : '';
        return `<button class="ev${state}" style="--c:${c}" data-ev="${idx}"><div class="t">${time}${dots}</div><div class="n">${ev.private ? '🔒 ' : ''}${esc(ev.title)}</div>${loc}</button>`;
      };
      const body = allDay.length + timed.length ? allDay.map(chip).join('') + timed.map(chip).join('') : '<div class="empty-day">Nothing planned</div>';
      const w = wx?.days?.find(d => d.t === dayKey(day));
      const wxHtml = w ? `<div class="day-wx"><span class="ic">${WX(w.c)}</span>${w.hi}° <small>${w.lo}°</small></div>` : '';
      const dinner = days === 3 ? dinnerOn(day) : '';
      const dinnerHtml = dinner ? `<div class="day-dinner"><b>Dinner</b>${esc(dinner)}${mealExtras(dinner)}</div>` : '';
      html += `<div class="day${i === 0 ? ' today' : ''}"><div class="day-head"><h3>${label}<b>${esc(big)}</b></h3>${wxHtml}</div>${dinnerHtml}
        <div class="evs">${body}<button class="add-ev" data-add="${dayKey(day)}">+ Add</button></div></div>`;
    }
    week.innerHTML = html;
  }

  // Dark text on light chip colors (the yellow), white on the rest.
  function textOn(hex) {
    const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
      .map(v => v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4);
    return .2126 * r + .7152 * g + .0722 * b > .3 ? '#2b2520' : '#fff';
  }

  function showEvent(ev) {
    const when = ev.allDay
      ? (() => { const s = parseDay(ev.start), e = addDays(parseDay(ev.end), -1); return dayKey(s) === dayKey(e) ? `${fmtDate(s)} · all day` : `${fmtDate(s)} – ${fmtDate(e)}`; })()
      : `${fmtDate(new Date(ev.start))} · ${fmtTime(new Date(ev.start))} – ${fmtTime(new Date(ev.end))}`;
    openSheet(`
      <h2>${esc(ev.title)}</h2>
      <div class="detail-row">🕒 ${esc(when)}</div>
      ${ev.location ? `<div class="detail-row">📍 ${esc(ev.location)}</div>` : ''}
      <div class="detail-row">🗓️ ${esc(ev.calendar)} — ${ev.owners.map(o => esc(o.name)).join(' & ')}</div>
      <div class="actions"><button class="btn" data-act="close">Done</button></div>`);
  }

  /* ── Meals (Apple Note, sent by an iPhone Shortcut) ── */
  const DAY_RE = /^(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thur?s?|fri|sat)(?![a-z])\.?/i;
  const DAY_IDX = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };

  // Reads a weekly plan in whatever shape the note is in: "Monday" on its own line with meals
  // under it, or "Mon – Tacos" on one line. Returns meals per weekday, or null if the note
  // has no day names at all (then the whole note is shown).
  function parseMeals(text) {
    const byDay = {};
    let cur = null, found = false;
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.replace(/^[\s\-•*#◦▪︎]+/, '').trim();
      if (!line) continue;
      const m = line.match(DAY_RE);
      if (m) {
        cur = DAY_IDX[m[1].slice(0, 3).toLowerCase()];
        found = true;
        byDay[cur] = byDay[cur] || [];
        const rest = line.slice(m[0].length).replace(/^[\s,]*(\d{1,2}\/\d{1,2}(\/\d{2,4})?)?[\s:–—\-.,)]*/, '').trim();
        if (rest) byDay[cur].push(rest);
      } else if (cur !== null) {
        byDay[cur].push(line);
      }
    }
    return found ? byDay : null;
  }

  function latestMealNote() {
    const notes = members().map(m => view()[m.id]?.meals).filter(x => x && x.text);
    notes.sort((a, b) => new Date(b.at) - new Date(a.at));
    return notes[0] || null;
  }
  /* ── Meal plan (stored in the first person's script, like the family list) ── */
  const K_LOCAL_PLAN = 'hub.plan';
  const cleanStr = (v, n) => String(v || '').replace(/\s+/g, ' ').trim().slice(0, n);
  const safeLink = u => /^https?:\/\/\S+$/.test(u || '') ? u : '';
  function cleanFav(f) {
    const name = cleanStr(f?.name, 60);
    if (!name) return null;
    return {
      name, link: safeLink(cleanStr(f.link, 500)),
      cooks: (f.cooks || []).map(c => cleanStr(c, 40)).filter(Boolean).slice(0, 6),
      items: (f.items || []).map(i => cleanStr(i, 80)).filter(Boolean).slice(0, 40)
    };
  }
  function currentPlan() {
    if (demoOn()) { view(); return demo.plan || (demo.plan = demoPlan()); }
    const home = listHome();
    const p = home ? data[home.id]?.plan : load(K_LOCAL_PLAN, null);
    return { days: p?.days || {}, favs: p?.favs || [] };
  }
  // Mirrors applyPlanOp_ in hub-script.gs so the screen updates before the script answers.
  function applyPlanOp(plan, op) {
    const days = { ...plan.days };
    const favs = new Map(plan.favs.map(f => [f.name.toLowerCase(), f]));
    const setDinner = (date, text) => {
      const day = { b: '', l: '', ...days[date], d: cleanStr(text, 120) };
      if (day.b || day.l || day.d) days[date] = day; else delete days[date];
    };
    if (op.action === 'planSet' && op.slot === 'd') setDinner(op.date, op.text);
    if (op.action === 'favSave') {
      const f = cleanFav(op);
      if (f) { if (op.oldName) favs.delete(op.oldName.toLowerCase()); favs.set(f.name.toLowerCase(), f); }
    }
    if (op.action === 'favDelete') favs.delete(op.name.toLowerCase());
    if (op.action === 'planImport') {
      for (const [date, text] of Object.entries(op.days)) if (cleanStr(text, 120)) setDinner(date, text);
      for (const raw of op.favs) {
        const f = cleanFav(raw), old = f && favs.get(f.name.toLowerCase());
        if (!f) continue;
        favs.set(f.name.toLowerCase(), old ? { ...old, link: old.link || f.link, items: old.items?.length ? old.items : f.items,
          cooks: [...new Set([...(old.cooks || []), ...f.cooks])] } : f);
      }
    }
    return { days, favs: [...favs.values()].sort((a, b) => a.name.localeCompare(b.name)) };
  }
  async function planOp(op) {
    if (demoOn()) { demo.plan = applyPlanOp(currentPlan(), op); renderMealsEverywhere(); return; }
    const home = listHome();
    if (!home) { save(K_LOCAL_PLAN, applyPlanOp(currentPlan(), op)); renderMealsEverywhere(); return; }
    const d = data[home.id] || (data[home.id] = {});
    d.plan = applyPlanOp(currentPlan(), op);
    renderMealsEverywhere();
    try {
      const j = await postScript(home, op);
      d.plan = j.plan; save(K_DATA, data); renderMealsEverywhere();
    } catch (e) {
      toast(e.message === 'unknown action' ? 'Update the Google script to the latest version first (see README).' : `Couldn't save the meal plan (${e.message}).`);
    }
  }
  function renderMealsEverywhere() { renderMeals(); renderWeek(); }

  /* Reads a pasted meals note in the shape Carolyn keeps it:
       9/25                     ← a week starting that day
       Friday- Chicken pot pie soup
       ...
       Chicken pot pie soup https://…      ← a recipe (name and link on one line)
       Zero carb garlic bread              ← or the name, then the link on the next line
       https://…
       Meals Scott can cook                ← names below are tagged with that cook
       Chili
     Links with no name nearby can't be identified, so they're counted, not imported. */
  function parseNoteImport(text) {
    const days = {}, favs = new Map(), unnamed = new Set();
    let week = null, pending = null, cook = '';
    const addFav = (name, link = '') => {
      name = cleanStr(name.replace(/[\s:\-–—]+$/, ''), 60);
      if (!name) return;
      const k = name.toLowerCase(), f = favs.get(k) || { name, link: '', cooks: [], items: [] };
      if (link && !f.link) f.link = link;
      if (cook && !f.cooks.includes(cook)) f.cooks.push(cook);
      favs.set(k, f);
    };
    const flush = () => { if (pending) addFav(pending); pending = null; };
    for (const raw of String(text || '').split(/\r?\n/)) {
      const line = raw.replace(/^[\s\-•*◦▪︎]+/, '').trim();
      if (!line) continue;
      const date = line.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
      if (date) { flush(); week = resolveDate(+date[1], +date[2], date[3]); cook = ''; continue; }
      const wd = week && line.match(DAY_RE);
      if (wd) {
        const meal = line.slice(wd[0].length).replace(/^[\s:–—\-.,)]+/, '').trim();
        if (meal) days[dayKey(onOrAfter(week, DAY_IDX[wd[1].slice(0, 3).toLowerCase()]))] = meal;
        continue;
      }
      week = null;
      const who = line.match(/^meals?\s+(\w+)\s+can\s+(cook|make)/i);
      if (who) { flush(); cook = who[1][0].toUpperCase() + who[1].slice(1).toLowerCase(); continue; }
      if (/^this week'?s menu$/i.test(line)) continue;
      const url = line.match(/https?:\/\/\S+/);
      if (url) {
        const before = line.slice(0, url.index).trim();
        if (before) { flush(); addFav(before, url[0]); }
        else if (pending) { addFav(pending, url[0]); pending = null; }
        else if (slugName(url[0])) addFav(slugName(url[0]), url[0]);
        else unnamed.add(url[0].replace(/[?#].*$/, ''));
        continue;
      }
      if (cook) { addFav(line); continue; }
      flush();
      pending = line;
    }
    flush();
    return { days, favs: [...favs.values()], unnamed: unnamed.size };
  }
  // "https://site.com/ditalini-pasta-with-bacon-and-peas/" → "Ditalini pasta with bacon and peas"
  function slugName(url) {
    try {
      const u = new URL(url);
      if (/facebook|fb\.|youtu|instagram|tiktok/.test(u.hostname)) return '';
      const slug = u.pathname.split('/').filter(Boolean).pop() || '';
      const words = slug.replace(/\.\w+$/, '').split('-').filter(w => /^[a-z]+$/i.test(w));
      return words.length >= 2 ? words.join(' ').replace(/^./, c => c.toUpperCase()) : '';
    } catch { return ''; }
  }
  // A month/day with no year: the year that puts it closest to today.
  function resolveDate(m, d, y) {
    if (y) return new Date(+y < 100 ? 2000 + +y : +y, m - 1, d);
    const now = new Date(), cands = [-1, 0, 1].map(k => new Date(now.getFullYear() + k, m - 1, d));
    return cands.sort((a, b) => Math.abs(a - now) - Math.abs(b - now))[0];
  }
  const onOrAfter = (start, dow) => addDays(start, (dow - start.getDay() + 7) % 7);
  let noteCache = { text: null, parsed: null };
  function noteImport(note) {
    if (noteCache.text !== note.text) noteCache = { text: note.text, parsed: parseNoteImport(note.text) };
    return noteCache.parsed;
  }

  // A day's dinner: the planner wins; otherwise the Apple Note, if there still is one.
  function dinnerOn(day) {
    const planned = currentPlan().days[dayKey(day)]?.d;
    if (planned) return planned;
    const note = latestMealNote();
    if (!note) return '';
    const dated = noteImport(note).days[dayKey(day)];
    if (dated) return dated;
    const items = parseMeals(note.text)?.[day.getDay()];
    if (!items?.length || Object.keys(noteImport(note).days).length) return '';
    const d = items.find(x => /^(dinner|supper|d)\s*[:\-–—]/i.test(x));
    return d ? d.replace(/^(dinner|supper|d)\s*[:\-–—]\s*/i, '') : items.join(' · ');
  }
  // Matches a planned dinner to a favorite, ignoring case, emoji and punctuation, and allowing one
  // letter's difference in longer names ("Ghoulash 👻" → "Goulash").
  const normMeal = n => String(n || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();
  function oneEditApart(a, b) {
    if (Math.abs(a.length - b.length) > 1) return false;
    let i = 0, j = 0, edits = 0;
    while (i < a.length && j < b.length) {
      if (a[i] === b[j]) { i++; j++; continue; }
      if (++edits > 1) return false;
      if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
    }
    return edits + (a.length - i) + (b.length - j) <= 1;
  }
  function favFor(name, favs = currentPlan().favs) {
    const n = normMeal(name);
    if (!n) return undefined;
    return favs.find(f => normMeal(f.name) === n) || (n.length >= 6 ? favs.find(f => oneEditApart(normMeal(f.name), n)) : undefined);
  }
  // 🔗 recipe and 👨‍🍳 cook markers for a meal that matches a favorite.
  function mealExtras(name) {
    const f = name && favFor(name);
    if (!f) return '';
    const link = safeLink(f.link);
    return (link ? ` <a class="rl" href="${esc(link)}" target="_blank" rel="noopener noreferrer" title="Open the recipe">🔗</a>` : '') +
      (f.cooks?.length ? ` <span class="cook" title="${esc(f.cooks.join(', '))} can cook this">👨‍🍳 ${esc(f.cooks.join(', '))}</span>` : '');
  }
  const planWeekStart = (d = new Date()) => addDays(startOfDay(d), -((d.getDay() - (+cfg.weekStart) + 7) % 7));

  function renderMeals() {
    const el = $('#meals');
    const today = startOfDay(new Date()), tonight = dinnerOn(today);
    const rest = Array.from({ length: 6 }, (_, i) => addDays(today, i + 1)).map(d => [d, dinnerOn(d)]).filter(([, m]) => m);
    el.innerHTML = `<h2>🍽️ Dinner<button class="plan-btn" data-act="planner">Plan dinners</button></h2>
      ${tonight ? `<div class="tonight"><small>Tonight</small>${esc(tonight)}${mealExtras(tonight)}</div>`
        : '<div class="hint">Nothing planned for tonight. Tap <b>Plan dinners</b> to fill in the week.</div>'}
      ${rest.length ? `<div class="week-dinners">${rest.map(([d, m]) => `<div><b>${d.toLocaleDateString([], { weekday: 'short' })}</b><span>${esc(m)}</span></div>`).join('')}</div>` : ''}`;
  }

  /* ── Family list ── */
  function applyListOp(list, op) {
    const now = Date.now();
    list = list.map(i => ({ ...i }));
    if (op.action === 'listAdd' && op.text && !list.some(i => i.id === op.id)) list.push({ id: op.id, text: op.text, done: false, at: now });
    if (op.action === 'listAddMany') for (const it of op.items) if (!list.some(i => i.id === it.id)) list.push({ id: it.id, text: it.text, done: false, at: now });
    if (op.action === 'listToggle') list.forEach(i => { if (i.id === op.id) { i.done = !i.done; i.at = now; } });
    if (op.action === 'listClearDone') list = list.filter(i => !i.done);
    return list;
  }
  function currentList() {
    if (demoOn()) return view()['demo-a'].list;
    const home = listHome();
    return home ? (data[home.id]?.list || []) : load(K_LOCAL_LIST, []);
  }
  async function listOp(op) {
    if (demoOn()) { demo['demo-a'].list = applyListOp(demo['demo-a'].list, op); renderList(); return; }
    const home = listHome();
    if (!home) { save(K_LOCAL_LIST, applyListOp(load(K_LOCAL_LIST, []), op)); renderList(); return; }
    const d = data[home.id] || (data[home.id] = {});

      <form class="list-add" id="list-form"><input id="list-input" placeholder="Add an item…" autocomplete="off" enterkeyhint="done"><button class="btn">Add</button></form>
      ${open.map(li).join('')}${done.map(li).join('')}

  /* ── Weather (Open-Meteo, no key) ── */
  const WX = c => c === 0 ? '☀️' : c <= 2 ? '🌤️' : c === 3 ? '☁️' : c <= 48 ? '🌫️' : c <= 57 ? '🌦️' : c <= 67 ? '🌧️' : c <= 77 ? '🌨️' : c <= 82 ? '🌧️' : c <= 86 ? '🌨️' : '⛈️';
  async function getWeather() {
    const zip = String(cfg.zip || '').trim();
    if (!zip) return null;
    const c = load(K_WX, null);
    if (c && c.zip === zip && Date.now() - c.ts < 20 * 60 * 1000) return c;
    let geo = load(K_GEO, null);
    if (!geo || geo.zip !== zip) {
      const r = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(zip)}&count=1&countryCode=US&language=en`);
      const loc = (await r.json()).results?.[0];
      if (!loc) throw new Error('ZIP not found');
      geo = { zip, lat: loc.latitude, lon: loc.longitude };
      save(K_GEO, geo);
    }
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto&forecast_days=5`);
    const j = await r.json();
    const out = { zip, ts: Date.now(), now: { t: Math.round(j.current.temperature_2m), c: j.current.weather_code },
      days: j.daily.time.map((t, i) => ({ t, c: j.daily.weather_code[i], hi: Math.round(j.daily.temperature_2m_max[i]), lo: Math.round(j.daily.temperature_2m_min[i]) })) };
    save(K_WX, out);
    return out;
  }
  let wx = null;
  async function refreshWeather() {
    try { wx = await getWeather(); } catch { wx = load(K_WX, null); }
    renderWeather();
    renderWeek();
  }
  function renderWeather() {
    const el = $('#wx');
    if (!wx || wx.zip !== String(cfg.zip || '').trim()) { el.innerHTML = ''; return; }
    const [d0, ...rest] = wx.days;
    el.innerHTML = `
      <div class="wx-now"><span class="ic">${WX(wx.now.c)}</span><span class="tp">${wx.now.t}°</span>

      <div class="wx-days">${rest.slice(0, 4).map(d => `<div class="wx-day">${parseDay(d.t).toLocaleDateString([], { weekday: 'short' })}<span class="ic">${WX(d.c)}</span><b>${d.hi}°</b> ${d.lo}°</div>`).join('')}</div>`;
  }

  /* ── Clock, status ── */
  let lastDay = dayKey(new Date());
  function tick() {
    const now = new Date();
    $('#clock').textContent = fmtClock(now);
    $('#date').textContent = fmtDate(now);
    $$('[data-clock]').forEach(e => { e.textContent = fmtClock(now); });
    $$('[data-date]').forEach(e => { e.textContent = fmtDate(now); });
    if (dayKey(now) !== lastDay) { lastDay = dayKey(now); render(); }
    // A daily reload at 3am picks up any update to this page on a tablet that never closes it.
    if (now.getHours() === 3 && localStorage.getItem(K_RELOAD) !== dayKey(now)) {
      try { localStorage.setItem(K_RELOAD, dayKey(now)); } catch {}
      location.reload();
    }

  }
  function renderStatus() {
    const el = $('#status');
    if (demoOn()) { el.textContent = 'Sample data — open Settings to connect your accounts'; el.className = 'status'; return; }
    const errs = connected().filter(m => data[m.id]?.err).map(m => `${m.name}: ${data[m.id].err}`);
    const ats = connected().map(m => data[m.id]?.at).filter(Boolean);
    el.className = 'status' + (errs.length ? ' warn' : '');
    el.textContent = errs.length ? `⚠ ${errs.join(' · ')}` : ats.length ? `Updated ${ago(Math.min(...ats))}` : '';
  }

  function render() {
    renderWeek(); renderMeals(); renderList(); renderStatus(); renderSaverInfo(); renderKidButton();
    if (!$('#kid').hidden) renderKid();
  }

  /* ── Photo frame & night mode ── */
  // The script returns Drive file IDs (Drive folder) or full image links (iCloud Shared Album).
  const isIcloudImage = u => { try { const h = new URL(u); return h.protocol === 'https:' && h.hostname.endsWith('.icloud-content.com'); } catch { return false; } };
  const photoUrls = () => demoOn() ? demoPhotos()
    : connected().flatMap(m => (data[m.id]?.photos || []).map(p =>
        /^https:/.test(p) ? (isIcloudImage(p) ? p : null) : `https://drive.google.com/thumbnail?id=${encodeURIComponent(p)}&sz=w1920`)).filter(Boolean);
  let lastPhotoRefresh = 0;
  const saver = { on: false, timer: null, order: [], i: 0, layer: 0 };
  let lastTouch = Date.now();

  function nextPhoto() {
    const urls = photoUrls();
    $('#saver-empty').hidden = urls.length > 0;
    if (!urls.length) return;
    // New links after a refresh (iCloud's expire): start a fresh shuffle with them.
    const sig = urls.length + '|' + urls[0];
    if (sig !== saver.sig) { saver.sig = sig; saver.i = Infinity; }
    if (saver.i >= saver.order.length) {
      saver.order = urls.slice().sort(() => Math.random() - .5);
      saver.i = 0;
    }
    const url = saver.order[saver.i++];
    const img = new Image();
    img.onload = () => {
      if (!saver.on) return;
      const slides = $$('#saver .slide');
      const next = slides[saver.layer ^ 1];
      next.querySelector('.bg').src = url;
      next.querySelector('.fg').src = url;
      next.classList.add('show');
      slides[saver.layer].classList.remove('show');
      saver.layer ^= 1;
    };
    // An expired or missing photo: move straight on, and fetch fresh links (at most every 5 minutes).
    img.onerror = () => {
      if (Date.now() - lastPhotoRefresh > 5 * 60 * 1000) { lastPhotoRefresh = Date.now(); refreshAll(['photos']); }
      if (saver.on && !saver.skipping) { saver.skipping = true; setTimeout(() => { saver.skipping = false; nextPhoto(); }, 300); }
    };
    img.src = url;
  }
  function startSaver() {
    if (saver.on) return;
    saver.on = true;
    $('#saver').hidden = false;
    renderSaverInfo();
    nextPhoto();
    saver.timer = setInterval(nextPhoto, Math.max(5, +cfg.photoSec || 20) * 1000);
  }
  function stopSaver() {
    saver.on = false;
    clearInterval(saver.timer);
    $('#saver').hidden = true;
    $$('#saver .slide').forEach(s => s.classList.remove('show'));
  }
  function renderSaverInfo() {
    const ev = nextEvent(), el = $('#saver-next');
    if (!ev) { el.innerHTML = wx ? `${WX(wx.now.c)} ${wx.now.t}°` : ''; return; }
    const s = new Date(ev.start), started = s.getTime() <= Date.now();
    const when = started ? '' : dayKey(s) === dayKey(new Date()) ? fmtTime(s) : `${s.toLocaleDateString([], { weekday: 'short' })} ${fmtTime(s)}`;
    el.innerHTML = `<small>${started ? 'Happening now' : 'Up next'}</small>${when ? esc(when) + ' · ' : ''}${esc(ev.title)}${wx ? `<br>${WX(wx.now.c)} ${wx.now.t}°` : ''}`;
  }

  function inNight(d = new Date()) {
    const f = +cfg.nightFrom, t = +cfg.nightTo, h = d.getHours();
    if (f === t) return false;
    return f < t ? h >= f && h < t : h >= f || h < t;
  }
  function idleCheck() {
    const idle = Date.now() - lastTouch;
    const busy = !$('#modal').hidden;
    if (idle > 60000) document.activeElement?.blur?.();
    const night = inNight() && idle > NIGHT_IDLE_MS && !busy && $('#kid').hidden;
    $('#night').hidden = !night;
    if (night) { if (saver.on) stopSaver(); return; }
    if (!$('#kid').hidden) { if (idle > 3 * 60000) closeKid(); return; }
    if (!saver.on && +cfg.idleMin > 0 && idle > cfg.idleMin * 60000 && !busy) startSaver();
  }
  function wake() {
    lastTouch = Date.now();
    keepAwake();
    if (saver.on) { stopSaver(); return true; }
    if (!$('#night').hidden) { $('#night').hidden = true; return true; }
    return false;
  }

  /* ── Paul's view: school day or home day ──
     Home: weekends; anything titled "No school" / "Home day" on any calendar (so a family trip
     can be marked); and closures, breaks and holidays on a school calendar (the APS district
     calendar, or events the school-dates task added with 🏫). */
  const SCHOOL_CAL = /\baps\b|school/i;
  function dayType(day) {
    const { allDay, timed } = eventsOn(day, mergedEvents());
    const evs = [...allDay, ...timed];
    const fromSchool = e => SCHOOL_CAL.test(e.calendar || '') || /^🏫/.test(e.title);
    // "Fall Break - Schools Closed" → "Fall Break"; "No school - Disney" → "Disney".
    const reason = e => {
      const t = e.title.replace(/^🏫\s*/, '').trim();
      const rest = t.match(/^(no school|home day)\b[\s:,–—-]*(.*)$/i);
      return (rest ? rest[2] : t.split(/\s[-–—]\s/)[0]).trim().slice(0, 28);
    };
    const home = evs.find(e => /\bno school\b|\bhome day\b|\bschools? (are )?closed\b/i.test(e.title) ||
      (fromSchool(e) && /\b(break|holiday|closed)\b/i.test(e.title)));
    if (home) return { kind: 'home', why: reason(home) };
    const virtual = evs.find(e => fromSchool(e) && /\bvirtual\b/i.test(e.title));
    if (virtual) return { kind: 'virtual', why: '' };
    if (day.getDay() === 0 || day.getDay() === 6) return { kind: 'home', why: 'Weekend' };
    const short = evs.find(e => fromSchool(e) && /early (release|dismissal)|half[- ]day/i.test(e.title));
    return { kind: 'school', why: short ? 'Short day' : '' };
  }
  const KID = {
    school: { icon: '🏫', word: 'School day', say: "It's a school day!" },
    home: { icon: '🏠', word: 'Home day', say: "It's a home day. No school!" },
    virtual: { icon: '💻', word: 'School at home', say: "It's school at home, on the computer." }
  };
  // "Today is Friday. It's a school day!" / "On Monday, it's a home day. No school! It's Fall Break."
  function sayDay(day, rel) {
    const t = dayType(day), k = KID[t.kind], wd = day.toLocaleDateString([], { weekday: 'long' });
    const extra = t.why === 'Short day' ? " It's a short day." : t.why && t.why !== 'Weekend' ? ` It's ${t.why}.` : '';
    return (rel ? `${rel} is ${wd}. ${k.say}` : `On ${wd}, ${k.say[0].toLowerCase()}${k.say.slice(1)}`) + extra;
  }
  // Read aloud, like his morning routine app.
  function speakKid(text) {
    try {
      const synth = window.speechSynthesis;
      if (!synth) return;
      synth.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const v = synth.getVoices().find(v => /en[-_]US/i.test(v.lang) && /natural|google|samantha/i.test(v.name)) || synth.getVoices().find(v => /^en/i.test(v.lang));
      if (v) u.voice = v;
      u.rate = 0.92;
      synth.speak(u);
    } catch {}
  }
  function renderKid() {
    const today = startOfDay(new Date()), t = dayType(today), k = KID[t.kind];
    const week = Array.from({ length: 7 }, (_, i) => addDays(today, i + 1));
    $('#kid-body').innerHTML = `
      <button class="kid-today ${t.kind}" data-say="0">
        <div class="kid-day">Today · ${today.toLocaleDateString([], { weekday: 'long' })}</div>
        <div class="kid-icon" aria-hidden="true">${k.icon}</div>
        <div class="kid-word">${k.word}</div>
        ${t.why && t.why !== 'Weekend' ? `<div class="kid-why">${esc(t.why)}</div>` : ''}
      </button>
      <div class="kid-week">${week.map((d, i) => { const w = dayType(d); return `
        <button class="kid-mini ${w.kind}" data-say="${i + 1}">
          <b>${d.toLocaleDateString([], { weekday: 'short' })}</b>
          <span aria-hidden="true">${KID[w.kind].icon}</span>
          <small>${w.kind === 'school' ? 'School' : w.kind === 'virtual' ? 'Computer' : 'Home'}</small>
        </button>`; }).join('')}</div>
      <div class="kid-hint">Tap a picture to hear it</div>`;
  }
  let kidOpenedAt = 0;
  function openKid() {
    kidOpenedAt = Date.now();
    renderKid();
    $('#kid').hidden = false;
    speakKid(sayDay(startOfDay(new Date()), 'Today'));
  }
  function closeKid() { $('#kid').hidden = true; try { speechSynthesis.cancel(); } catch {} }
  function renderKidButton() { $('#btn-kid').textContent = cfg.kidName ? `🧒 ${cfg.kidName}` : ''; }

  // Keeps the tablet's screen from sleeping while the hub is open.
  let wakeLock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      }
    } catch {}
  }

  /* ── Snap a flyer: photo → Drive inbox → the scheduled Claude task adds its dates ── */
  let snap = null;
  // Shrinks the photo to a JPEG around 2000px on the long side, small enough to post to the
  // script and still sharp enough to read a flyer.
  function shrinkPhoto(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file), img = new Image();
      img.onload = () => {
        const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * k);
        c.height = Math.round(img.naturalHeight * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };

  // A timed event on Monday–Friday that overlaps the work day set in Settings.
  function duringWork(date, start, end) {
    if (!date || !start) return false;
    const dow = parseDay(date).getDay();
    if (dow === 0 || dow === 6) return false;
    const mins = t => +t.slice(0, 2) * 60 + +t.slice(3);
    const s = mins(start), e = end && end > start ? mins(end) : s + 60;
    return s < (+cfg.workTo) * 60 && e > (+cfg.workFrom) * 60;
  }

  function addDemoEvent(who, ev) {
    const d = parseDay(ev.date);
    const at = t => { const [h, m] = t.split(':').map(Number); const x = new Date(d); x.setHours(h, m); return x; };
    const start = ev.start ? at(ev.start) : null;
    const end = ev.start ? (ev.end && at(ev.end) > start ? at(ev.end) : new Date(start.getTime() + 3600e3)) : null;
    const out = { id: uid(), title: ev.title, location: ev.location, calendar: 'Family', allDay: !ev.start, private: !!ev.private,
      start: ev.start ? start.toISOString() : ev.date, end: ev.start ? end.toISOString() : dayKey(addDays(d, 1)) };
    demo[who.id].calendar.push(out);
    if (ev.guests.length) DEMO_MEMBERS.filter(m => m !== who).forEach(m => demo[m.id].calendar.push(out));
  }

    const want = [], missing = new Set();
    for (const k of keys) {

      if (!meal || isLeftovers(meal)) continue;
      const f = favFor(meal, favs);
      if (!f || !f.items?.length) { missing.add(meal); continue; }
      for (const it of f.items) if (!have.has(it.toLowerCase())) { have.add(it.toLowerCase()); want.push(it); }

    const note = missing.size ? ` No ingredients saved yet for ${[...missing].slice(0, 3).join(', ')}${missing.size > 3 ? '…' : ''}. Tap it under Favorites to add them.` : '';

  let unlockedUntil = 0, pinFails = 0, pinBlockedUntil = 0;
  async function sha256(text) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  const randomHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(b => b.toString(16).padStart(2, '0')).join('');

  function openSettings() {
    if (cfg.pinHash && Date.now() > unlockedUntil) { askPin(); return; }
    draft = JSON.parse(JSON.stringify(cfg));

  function askPin() {
    openSheet(`
      <h2>Enter PIN</h2>
      <div class="hint">Settings are locked because they hold the keys to your Google scripts.</div>
      <form id="pin-form" style="display:grid;gap:14px;margin-top:14px">
        <label class="field">PIN<input id="pin-in" type="password" inputmode="numeric" autocomplete="off" maxlength="8"></label>

        <div class="actions" style="margin-top:0">
          <button type="button" class="btn ghost" data-act="close">Cancel</button>
          <button class="btn">Unlock</button>
        </div>
      </form>`);
    setTimeout(() => $('#pin-in')?.focus(), 50);
    $('#pin-form').addEventListener('submit', async e => {
      e.preventDefault();
      const msg = $('#pin-msg');
      if (Date.now() < pinBlockedUntil) { msg.textContent = `Too many tries. Wait ${Math.ceil((pinBlockedUntil - Date.now()) / 1000)} seconds.`; return; }
      if (await sha256(cfg.pinSalt + ':' + $('#pin-in').value) === cfg.pinHash) {
        pinFails = 0;
        unlockedUntil = Date.now() + 5 * 60 * 1000;
        openSettings();
        return;
      }
      pinFails++;
      $('#pin-in').value = '';
      // Each run of five wrong tries locks the pad for longer.
      if (pinFails % 5 === 0) pinBlockedUntil = Date.now() + 60000 * 2 ** (pinFails / 5 - 1);
      msg.textContent = pinFails % 5 === 0 ? 'Too many tries. Locked for a while.' : 'Wrong PIN.';
    });
  }

    });
    draft.zip = $('#s-zip').value.trim();
    draft.idleMin = Math.max(0, +$('#s-idle').value || 0);
    draft.photoSec = Math.max(5, +$('#s-psec').value || 20);
    draft.days = +$('#s-days').value;
    draft.workFrom = +$('#s-wf').value;
    draft.workTo = +$('#s-wt').value;
    draft.weekStart = +$('#s-ws').value;
    draft.kidName = $('#s-kid').value.trim();
    draft.nightFrom = +$('#s-nf').value;
    draft.nightTo = +$('#s-nt').value;
  }
  function applyCfg(next) {
    cfg = cleanCfg(next);
    save(K_CFG, cfg);
    const ids = new Set(cfg.members.map(m => m.id));
    for (const id of Object.keys(data)) if (!ids.has(id)) delete data[id];
    save(K_DATA, data);
    render();
    refreshAll();
    refreshAll(['photos']);
    refreshWeather();
  }
  const b64 = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64 = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
  function importFromHash() {
    const m = location.hash.match(/^#setup=([\w-]+)/);
    if (!m) return;
    history.replaceState(null, '', location.pathname + location.search);
    loadSetup(m[1]);
  }
  // Returns true if settings were loaded. Used by setup links opened in the browser and by the
  // "Paste a setup link" box, which an iPhone Home Screen app needs because it keeps its own
  // storage, separate from Safari's.
  function loadSetup(code) {
    try {
      const next = JSON.parse(unb64(code));
      if (!Array.isArray(next.members)) throw new Error('no members');
      if (!confirm(`Load settings for ${next.members.map(x => x.name).join(' & ') || 'this hub'}? This replaces what's on this screen.`)) return false;
      applyCfg(next);
      toast('Settings loaded.');
      return true;
    } catch { toast('That setup link is damaged. Copy it again.'); return false; }
  }
  function openPasteSetup() {
    openSheet(`
      <h2>Paste a setup link</h2>
      <div class="hint">On the screen that's already set up: ⚙️ → Copy setup link. Send it here, copy it, and paste it below.</div>
      <form id="paste-form" style="display:grid;gap:14px;margin-top:14px">
        <label class="field">Setup link<input id="paste-in" autocomplete="off" placeholder="https://…hub.html#setup=…"></label>
        <div class="actions" style="margin-top:0">
          <button type="button" class="btn ghost" data-act="close">Cancel</button>
          <button class="btn">Load</button>
        </div>
      </form>`);
    setTimeout(() => $('#paste-in')?.focus(), 50);
    $('#paste-form').addEventListener('submit', e => {
      e.preventDefault();
      const m = $('#paste-in').value.trim().match(/setup=([\w-]+)/);
      if (!m) { toast('That doesn\'t look like a setup link. It contains "#setup=".'); return; }
      if (loadSetup(m[1])) closeSheet();
    });
  }

  /* ── Events ── */
  document.addEventListener('pointerdown', e => {
    if (wake()) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  document.addEventListener('keydown', () => { lastTouch = Date.now(); });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { keepAwake(); refreshAll(); }
  });

  document.addEventListener('click', async e => {
    const t = e.target;
    if (t.id === 'modal') { closeSheet(); return; }
    const say = t.closest('[data-say]');
    if (say) { const i = +say.dataset.say; speakKid(sayDay(addDays(startOfDay(new Date()), i), ['Today', 'Tomorrow'][i])); return; }
    const wk = t.closest('[data-week]');
    if (wk) { openPlanner(+wk.dataset.week); return; }
    const cart = t.closest('[data-cart]');
    if (cart) { addGroceries([cart.dataset.cart]); return; }
    const cartWeek = t.closest('[data-cart-week]');
    if (cartWeek) { addGroceries(cartWeek.dataset.cartWeek.split(',')); return; }
    const fav = t.closest('[data-fav]');
    if (fav) { openFavorite(fav.dataset.fav, false); return; }
    const newFav = t.closest('[data-newfav]');
    if (newFav) { openFavorite(newFav.dataset.newfav, true); return; }
    const favDel = t.closest('[data-favdel]');
    if (favDel) { if (confirm(`Delete the favorite "${favDel.dataset.favdel}"?`)) { planOp({ action: 'favDelete', name: favDel.dataset.favdel }); openPlanner(); } return; }
    const add = t.closest('[data-add]');
    if (add) { openAddEvent(add.dataset.add); return; }
    const ev = t.closest('[data-ev]');
    if (ev) { showEvent(events[+ev.dataset.ev]); return; }
    const li = t.closest('[data-li]');
    if (li) { listOp({ action: 'listToggle', id: li.dataset.li }); return; }
    const sw = t.closest('[data-color]');
    if (sw) {
      readSettingsForm();
      draft.members[+sw.closest('.member').dataset.i].color = sw.dataset.color;
      renderSettings();
      return;
    }
    const act = t.closest('[data-act]')?.dataset.act;
    if (!act) return;
    if (act === 'settings') openSettings();
    if (act === 'close') closeSheet();
    if (act === 'kid') openKid();
    if (act === 'kid-close') closeKid();
    if (act === 'paste-setup') openPasteSetup();
    if (act === 'planner') openPlanner();
    if (act === 'import') openImport();
    if (act === 'snap-again') { closeSheet(); openSnap(); }
    if (act === 'snap-send') sendSnap(t.closest('button'));
    if (act === 'demo') { cfg.demo = true; save(K_CFG, cfg); render(); }
    if (act === 'clear-done') listOp({ action: 'listClearDone' });
    if (act === 'fullscreen') { closeSheet(); document.documentElement.requestFullscreen?.().catch(() => {}); }
    if (act === 'add-member') {
      readSettingsForm();
      const used = draft.members.map(m => m.color);
      draft.members.push({ id: uid(), name: '', color: COLORS.find(c => !used.includes(c)) || COLORS[0], url: '', key: '', email: '', workEmail: '' });
      renderSettings();
    }
    if (act === 'remove') {
      readSettingsForm();
      draft.members.splice(+t.closest('.member').dataset.i, 1);
      renderSettings();
    }
    if (act === 'photo-src') {
      readSettingsForm();
      const box = t.closest('.member'), out = $('.photo-out', box), m = draft.members[+box.dataset.i];
      if (!m.url || !m.key) { out.textContent = 'Fill in the script URL and key first.'; return; }
      out.textContent = 'Checking the album…';
      try {
        const j = await postScript(m, { action: 'photoSource', link: $('.photo-src', box).value.trim() });
        out.textContent = j.kind === 'none' ? '✓ Photos turned off.'
          : `✓ ${j.count} photo${j.count === 1 ? '' : 's'} found in the ${j.kind === 'icloud' ? 'iCloud album' : 'Drive folder'}. The frame will use them.`;
        $('.photo-src', box).value = '';
        if (cfg.members.some(x => x.id === m.id)) refreshAll(['photos']);
      } catch (err) {
        out.textContent = err.message === 'unknown action' ? '✗ Update the Google script to the latest version first (see README).' : `✗ ${err.message}`;
      }
      return;
    }
    if (act === 'test') {
      readSettingsForm();
      const box = t.closest('.member'), out = $('.test-out', box), m = draft.members[+box.dataset.i];
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(m.url || '')) { out.textContent = 'The URL should start with https://script.google.com and end in /exec'; return; }
      out.textContent = 'Checking…';
      try {
        const j = await getScript(m, { parts: 'calendar,meals,photos' });
        const errs = Object.keys(j.errors || {});
        out.textContent = `✓ ${j.calendar?.length ?? 0} events, ${j.photos?.length ?? 0} photos` +
          (j.meals?.text ? ', meals note' : '') + (errs.length ? ` — problem with ${errs.join(', ')}` : '');
      } catch (err) {
        out.textContent = `✗ ${err.message === 'bad key' ? 'Wrong key' : 'Couldn’t reach it — check the URL and that access is set to "Anyone"'}`;
      }
    }
    if (act === 'save') {
      readSettingsForm();
      const pin = $('#s-pin').value.trim();
      if (pin && !/^\d{4,8}$/.test(pin)) { toast('The PIN must be 4 to 8 digits.'); return; }
      if ($('#s-pin-off')?.checked) { draft.pinHash = ''; draft.pinSalt = ''; }
      else if (pin) { draft.pinSalt = randomHex(16); draft.pinHash = await sha256(draft.pinSalt + ':' + pin); }
      draft.members = draft.members.filter(m => m.name || m.url);
      draft.members.forEach(m => { if (!m.name) m.name = 'Someone'; });
      draft.demo = false;
      closeSheet();
      applyCfg(draft);
    }
    if (act === 'copy-setup') {
      readSettingsForm();
      const link = `${location.origin}${location.pathname}#setup=${b64(JSON.stringify({ ...draft, demo: false }))}`;
      try { await navigator.clipboard.writeText(link); toast('Setup link copied'); }
      catch { prompt('Copy this link:', link); }
    }
  });

  // Planner cells save when you leave them (or pick a favorite from the suggestions).
  document.addEventListener('change', e => {
    const inp = e.target.closest?.('[data-slot]');
    if (!inp) return;
    planOp({ action: 'planSet', date: inp.dataset.date, slot: 'd', text: inp.value });
    delete inp.dataset.note;
    const info = $(`[data-info="${inp.dataset.date}"]`);
    if (info) info.innerHTML = planInfo(inp.value);
  });

  document.addEventListener('submit', e => {
    if (e.target.id !== 'list-form') return;
    e.preventDefault();
    const input = $('#list-input'), text = input.value.trim();
    if (!text) return;
    input.value = '';
    listOp({ action: 'listAdd', id: uid(), text });
  });

  $('#btn-settings').addEventListener('click', openSettings);
  $('#btn-snap').addEventListener('click', openSnap);
  $('#btn-photos').addEventListener('click', () => { lastTouch = Date.now(); startSaver(); });

  /* ── Start ── */
  render();
  tick();
  importFromHash();
  refreshAll();
  refreshAll(['photos']);
  refreshWeather();
  keepAwake();
  setInterval(tick, 5000);
  setInterval(() => refreshAll(), REFRESH_MS);
  setInterval(() => refreshAll(['photos']), PHOTO_REFRESH_MS);
  setInterval(refreshWeather, 20 * 60 * 1000);
  setInterval(renderStatus, 60 * 1000);
})();
</script>
</body>
</html>
